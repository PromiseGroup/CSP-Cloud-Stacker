<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#002353" />
  <title>Cloud Stacker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Manrope", "system-ui", "sans-serif"],
            mono: ["IBM Plex Mono", "ui-monospace", "monospace"],
          },
          colors: {
            main: "#002353",
            secondary: "#0b49ad",
            accent: "#2c71f5",
            gold: "#f5db2c",
          },
        },
      },
    };
  </script>
  <style>
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000814;
      color: #e8f0ff;
      font-family: Manrope, system-ui, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .is-hidden { display: none !important; }

    .font-mono, #score, #final-score, #initials {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }

    #initials {
      letter-spacing: 0.42em;
      text-indent: 0.42em;
    }

    #overlay-end, #overlay-end input, #overlay-end button, #d365-form-wrapper, #d365-form-wrapper * {
      touch-action: auto;
      user-select: text;
      -webkit-user-select: text;
    }

    .breathe { animation: breathe 2.4s ease-in-out infinite; }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.62; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    #overlay-end:not(.is-hidden) .end-card { animation: rise 480ms ease; }

    @media (prefers-reduced-motion: reduce) {
      .breathe, #overlay-end:not(.is-hidden) .end-card { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Cloud Stacker playfield"></canvas>

  <div id="hud" class="is-hidden pointer-events-none absolute inset-0 z-20">
    <div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-[#000814]/80 to-transparent"></div>
    <div class="absolute text-right" style="right: max(1.5rem, env(safe-area-inset-right)); top: max(1.25rem, env(safe-area-inset-top));">
      <div class="text-[10px] font-semibold uppercase tracking-[0.46em] text-white/50">Score</div>
      <div id="score" class="mt-1 text-4xl font-medium leading-none tracking-tight text-[#e8f0ff]">0</div>
    </div>
  </div>

  <div id="overlay-start" class="absolute inset-0 z-30 flex items-center justify-center px-6">
    <div class="w-full max-w-md rounded-3xl border border-white/10 bg-[#002353]/78 px-8 py-10 shadow-[0_40px_120px_rgba(0,0,0,0.45)] backdrop-blur-xl">
      <p class="text-[11px] font-semibold uppercase tracking-[0.48em] text-[#f5db2c]">Cloud Stacker</p>
      <div class="mt-4 h-px w-14 bg-[#f5db2c]"></div>
      <h1 class="mt-5 text-[clamp(2.5rem,7vh,4.4rem)] font-semibold leading-[0.96] tracking-[-0.035em] text-white">Build Your Cloud Stack</h1>
      <p class="mt-4 max-w-sm text-sm leading-relaxed text-white/65">Drop each rack on the one below. A true landing is worth more than a trimmed one.</p>
      <button id="btn-start" type="button" class="breathe mt-8 w-full rounded-xl bg-[#2c71f5] px-6 py-4 text-sm font-semibold uppercase tracking-[0.22em] text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.28)]">Tap to Start</button>
    </div>
  </div>

  <div id="overlay-end" class="is-hidden absolute inset-0 z-40">
    <div class="absolute inset-0 bg-[#002353]/75 backdrop-blur-md"></div>
    <div class="relative flex h-full items-start justify-center px-6 pt-[9vh]">
      <div class="end-card w-full max-w-md rounded-3xl border border-white/10 bg-[#002353]/82 px-8 py-9 shadow-[0_40px_120px_rgba(0,0,0,0.5)] backdrop-blur-xl">
        <p class="text-[11px] font-semibold uppercase tracking-[0.48em] text-[#f5db2c]">Cloud Stacker</p>
        <h2 class="mt-4 text-[clamp(2.2rem,5vh,3.4rem)] font-semibold leading-none tracking-[-0.03em] text-white">Stack Crashed!</h2>
        <p class="mt-4 font-mono text-lg text-white/80">Final Score: <span id="final-score">0</span></p>

        <div id="panel-initials">
          <label for="initials" class="mt-8 block text-[10px] font-semibold uppercase tracking-[0.36em] text-white/50">Arcade Initials</label>
          <input id="initials" maxlength="3" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="AAA" aria-label="Arcade Initials" class="mt-3 w-full rounded-xl border border-white/15 bg-[#000814]/70 px-4 py-4 text-center font-mono text-3xl uppercase text-white outline-none placeholder:text-white/25 focus:border-[#2c71f5]" />
          <button id="btn-save" type="button" class="mt-6 w-full rounded-xl bg-[#2c71f5] px-6 py-4 text-sm font-semibold uppercase tracking-[0.2em] text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.28)]">Save Score</button>
        </div>

        <div id="panel-lead" class="is-hidden">
          <div id="d365-form-wrapper" class="mt-8 rounded-xl border border-dashed border-white/20 bg-black/25 px-5 py-10 text-center text-sm tracking-wide text-white/60">CRM Form Goes Here</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LABELS = ["Compute", "Storage", "Copilot", "Defender", "Entra", "SharePoint"];
    const GRAVITY = 2800;
    const MAX_SPEED = 420;

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    const hud = document.getElementById("hud");
    const scoreEl = document.getElementById("score");
    const overlayStart = document.getElementById("overlay-start");
    const overlayEnd = document.getElementById("overlay-end");
    const panelInitials = document.getElementById("panel-initials");
    const panelLead = document.getElementById("panel-lead");
    const finalScoreEl = document.getElementById("final-score");
    const initialsInput = document.getElementById("initials");

    const sessionId = typeof crypto.randomUUID === "function"
      ? crypto.randomUUID()
      : Array.from(crypto.getRandomValues(new Uint8Array(16)), (byte, index) => {
          if (index === 6) byte = (byte & 0x0f) | 0x40;
          if (index === 8) byte = (byte & 0x3f) | 0x80;
          return byte.toString(16).padStart(2, "0");
        }).join("").replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/, "$1-$2-$3-$4-$5");

    let viewW = 1;
    let viewH = 1;
    let pixelRatio = 1;
    let mode = "start";
    let score = 0;
    let scoreFlash = 0;
    let cameraY = 0;
    let hSpeed = 155;
    let blockH = 64;
    let shake = 0;
    let spawnSide = 1;
    let lastDt = 1 / 60;
    let lastNow = 0;
    let blocks = [];
    let debris = [];
    let floaters = [];
    let mover = null;
    let falling = null;
    let noisePattern = null;

    function randomLabel() {
      return LABELS[(Math.random() * LABELS.length) | 0];
    }

    function roundRect(x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r, w / 2, h / 2));
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function makeNoise() {
      const tile = document.createElement("canvas");
      tile.width = 128;
      tile.height = 128;
      const nctx = tile.getContext("2d");
      const image = nctx.createImageData(128, 128);
      for (let i = 0; i < image.data.length; i += 4) {
        const shade = (Math.random() * 255) | 0;
        image.data[i] = shade;
        image.data[i + 1] = shade;
        image.data[i + 2] = shade;
        image.data[i + 3] = 255;
      }
      nctx.putImageData(image, 0, 0);
      noisePattern = ctx.createPattern(tile, "repeat");
    }

    function resize() {
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(viewW * pixelRatio));
      canvas.height = Math.max(1, Math.round(viewH * pixelRatio));
    }

    function resetWorld() {
      blockH = Math.round(Math.min(70, Math.max(52, viewH * 0.06)));
      const width = Math.round(Math.max(168, Math.min(viewW * 0.46, viewW - 64)));
      blocks = [{
        x: (viewW - width) / 2,
        y: viewH - blockH - Math.round(viewH * 0.075),
        w: width,
        h: blockH,
        label: randomLabel(),
        cutLeft: false,
        cutRight: false,
        glow: 0,
      }];
      cameraY = 0;
      debris = [];
      floaters = [];
      falling = null;
      shake = 0;
      score = 0;
      scoreFlash = 0;
      hSpeed = 155;
      spawnSide = 1;
      spawnMover(width);
      paintScore();
    }

    function spawnMover(width) {
      const fromLeft = spawnSide > 0;
      spawnSide *= -1;
      mover = {
        x: fromLeft ? 18 : viewW - width - 18,
        y: 0,
        w: width,
        h: blockH,
        label: randomLabel(),
        dir: fromLeft ? 1 : -1,
      };
    }

    function setMode(next) {
      mode = next;
      overlayStart.classList.toggle("is-hidden", next !== "start");
      hud.classList.toggle("is-hidden", next !== "playing");
      overlayEnd.classList.toggle("is-hidden", next !== "gameover" && next !== "lead");
      panelInitials.classList.toggle("is-hidden", next !== "gameover");
      panelLead.classList.toggle("is-hidden", next !== "lead");
      if (next === "gameover") {
        finalScoreEl.textContent = String(score);
        initialsInput.value = "";
        initialsInput.style.borderColor = "rgba(255,255,255,0.15)";
        requestAnimationFrame(() => initialsInput.focus());
      }
    }

    function begin() {
      if (mode !== "start") return;
      resetWorld();
      setMode("playing");
    }

    function perfectWindow() {
      return Math.max(4, hSpeed * lastDt * 0.5);
    }

    function dropBlock() {
      if (mode !== "playing" || !mover || falling) return;
      falling = {
        x: mover.x,
        y: mover.y,
        w: mover.w,
        h: mover.h,
        label: mover.label,
        vy: 90,
        rot: 0,
        miss: false,
        missDir: 1,
      };
      mover = null;
    }

    function spawnDebris(x, y, w, h, dir) {
      if (w < 0.75) return;
      debris.push({
        x,
        y,
        w,
        h,
        vx: dir * (90 + Math.random() * 160),
        vy: -40 - Math.random() * 50,
        rot: 0,
        vr: dir * (1.4 + Math.random() * 2.2),
        alpha: 1,
        cutLeft: dir > 0,
        cutRight: dir < 0,
      });
    }

    function spawnFloater(text, x, worldY, gold) {
      floaters.push({
        text,
        x,
        y: worldY - cameraY,
        life: 1,
        gold,
      });
    }

    function placeBlock(piece, below, left, right) {
      const aligned = Math.abs(piece.x - below.x) <= perfectWindow();
      let x = left;
      let w = right - left;
      let cutLeft = piece.x < left - 0.4;
      let cutRight = piece.x + piece.w > right + 0.4;

      if (aligned) {
        x = below.x;
        w = below.w;
        cutLeft = false;
        cutRight = false;
        score += 500;
        shake = 7;
        scoreFlash = 0.55;
        spawnFloater("+500", x + w / 2, piece.y, true);
      } else {
        if (cutLeft) spawnDebris(piece.x, piece.y, left - piece.x, piece.h, -1);
        if (cutRight) spawnDebris(right, piece.y, piece.x + piece.w - right, piece.h, 1);
        score += 100;
        spawnFloater("+100", x + w / 2, piece.y, false);
      }

      blocks.push({
        x,
        y: piece.y,
        w,
        h: piece.h,
        label: piece.label,
        cutLeft,
        cutRight,
        glow: aligned ? 1 : 0,
      });
      hSpeed = Math.min(MAX_SPEED, hSpeed + 18);
      spawnMover(w);
      paintScore();
    }

    function updateMover(dt) {
      const lane = Math.max(104, viewH * 0.155);
      mover.y = cameraY + lane;
      mover.x += mover.dir * hSpeed * dt;
      const minX = 12;
      const maxX = viewW - mover.w - 12;
      if (maxX <= minX) {
        mover.x = (viewW - mover.w) / 2;
        return;
      }
      if (mover.x <= minX) {
        mover.x = minX;
        mover.dir = 1;
      } else if (mover.x >= maxX) {
        mover.x = maxX;
        mover.dir = -1;
      }
    }

    function updateFalling(dt) {
      falling.vy = Math.min(1700, falling.vy + GRAVITY * dt);
      falling.y += falling.vy * dt;
      if (falling.miss) falling.rot += falling.missDir * dt * 2.4;

      const below = blocks[blocks.length - 1];
      if (!falling.miss && falling.y + falling.h >= below.y) {
        const left = Math.max(falling.x, below.x);
        const right = Math.min(falling.x + falling.w, below.x + below.w);
        if (right - left <= 0) {
          falling.miss = true;
          falling.missDir = falling.x + falling.w / 2 < below.x + below.w / 2 ? -1 : 1;
        } else {
          falling.y = below.y - falling.h;
          placeBlock(falling, below, left, right);
          falling = null;
          return;
        }
      }

      if (falling && falling.y - cameraY > viewH + falling.h + 60) {
        falling = null;
        setMode("gameover");
      }
    }

    function easeCamera(dt) {
      const top = blocks[blocks.length - 1];
      const target = viewH * 0.62;
      if (top.y - cameraY < target) {
        const desired = top.y - target;
        cameraY += (desired - cameraY) * Math.min(1, dt * 2.6);
      }
    }

    function update(dt) {
      const attract = mode === "start" || mode === "playing";
      if (falling && (mode === "playing" || falling.miss)) updateFalling(dt);
      if (!falling && mover && attract) updateMover(dt);
      if (blocks.length) easeCamera(dt);

      for (let i = debris.length - 1; i >= 0; i--) {
        const bit = debris[i];
        bit.vy += GRAVITY * dt;
        bit.x += bit.vx * dt;
        bit.y += bit.vy * dt;
        bit.rot += bit.vr * dt;
        bit.alpha -= dt * 0.55;
        if (bit.alpha <= 0 || bit.y - cameraY > viewH + 160) debris.splice(i, 1);
      }

      for (let i = floaters.length - 1; i >= 0; i--) {
        const floater = floaters[i];
        floater.y -= 38 * dt;
        floater.life -= dt;
        if (floater.life <= 0) floaters.splice(i, 1);
      }

      for (const block of blocks) {
        if (block.glow > 0) block.glow = Math.max(0, block.glow - dt * 1.15);
      }

      if (scoreFlash > 0) scoreFlash = Math.max(0, scoreFlash - dt);
      if (shake > 0) shake = Math.max(0, shake - dt * 22);
      paintScore();
    }

    function drawChassis(x, y, w, h, label, opts) {
      if (w < 1 || h < 1) return;
      const cutLeft = !!opts.cutLeft;
      const cutRight = !!opts.cutRight;
      const hot = !!opts.hot;
      const glow = opts.glow || 0;
      const depth = Math.min(16, Math.max(9, h * 0.26));
      const skew = depth * 0.7;

      ctx.fillStyle = glow > 0 ? "#f5db2c" : (hot ? "#2c71f5" : "#1b467f");
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + skew, y - depth);
      ctx.lineTo(x + w + skew, y - depth);
      ctx.lineTo(x + w, y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = cutRight ? "#d4894a" : "#070f1c";
      ctx.beginPath();
      ctx.moveTo(x + w, y);
      ctx.lineTo(x + w + skew, y - depth);
      ctx.lineTo(x + w + skew, y + h - depth);
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = hot ? "#12263f" : "#0d1e34";
      ctx.fillRect(x, y, w, h);

      if (cutLeft) {
        ctx.fillStyle = "#d4894a";
        ctx.fillRect(x, y, Math.min(5, w), h);
      }

      ctx.fillStyle = glow > 0 ? "#fff4b0" : "rgba(232, 240, 255, 0.22)";
      ctx.fillRect(x, y, w, 1);

      if (label && w > 86 && h > 22) {
        const size = Math.max(11, Math.min(13, Math.floor(h * 0.28)));
        ctx.font = `500 ${size}px "IBM Plex Mono", ui-monospace, monospace`;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.letterSpacing = "0.08em";
        const text = label.toUpperCase();
        if (ctx.measureText(text).width <= w - 32) {
          ctx.fillStyle = "rgba(232, 240, 255, 0.8)";
          ctx.fillText(text, x + 14, y + h * 0.56);
        }
        ctx.letterSpacing = "0px";
      }

      if (w > 64 && h > 20) {
        ctx.fillStyle = "#f5db2c";
        ctx.fillRect(x + w - 22, y + h * 0.5 - 2, 4, 4);
      }
    }

    function drawPiece(x, y, w, h, label, rot, alpha, opts) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      if (rot) ctx.rotate(rot);
      ctx.globalAlpha = alpha;
      drawChassis(-w / 2, -h / 2, w, h, label, opts);
      ctx.restore();
    }

    function drawBackground(time) {
      const sky = ctx.createLinearGradient(0, 0, 0, viewH);
      sky.addColorStop(0, "#0a3d86");
      sky.addColorStop(0.28, "#002353");
      sky.addColorStop(1, "#000814");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, viewW, viewH);

      const pulse = 0.85 + Math.sin(time * 0.6) * 0.15;
      const shaft = ctx.createRadialGradient(viewW * 0.5, -20, 10, viewW * 0.5, viewH * 0.12, viewW * 0.72);
      shaft.addColorStop(0, `rgba(255, 176, 32, ${0.14 * pulse})`);
      shaft.addColorStop(0.32, `rgba(44, 113, 245, ${0.18 * pulse})`);
      shaft.addColorStop(1, "rgba(44, 113, 245, 0)");
      ctx.fillStyle = shaft;
      ctx.fillRect(0, 0, viewW, viewH);

      const parallax = -cameraY * 0.15;
      const towers = [
        [0.04, 0.3, 0.1, 0.46],
        [0.16, 0.42, 0.055, 0.32],
        [0.8, 0.26, 0.13, 0.5],
        [0.92, 0.44, 0.07, 0.3],
      ];
      for (const [nx, ny, nw, nh] of towers) {
        const x = nx * viewW;
        const y = ny * viewH + parallax;
        const tw = nw * viewW;
        const th = nh * viewH;
        ctx.fillStyle = "rgba(1, 14, 36, 0.72)";
        ctx.fillRect(x, y, tw, th);
        ctx.fillStyle = "rgba(44, 113, 245, 0.22)";
        ctx.fillRect(x + tw * 0.18, y + 16, 2, th * 0.35);
        ctx.fillStyle = "rgba(245, 219, 44, 0.35)";
        ctx.fillRect(x + tw * 0.72, y + th * 0.2, 3, 3);
      }

      if (blocks.length) {
        const anchor = blocks[0];
        const sx = anchor.x + anchor.w / 2;
        const sy = anchor.y - cameraY + anchor.h;
        const pool = ctx.createRadialGradient(sx, sy, 8, sx, sy, anchor.w);
        pool.addColorStop(0, "rgba(44, 113, 245, 0.2)");
        pool.addColorStop(1, "rgba(44, 113, 245, 0)");
        ctx.fillStyle = pool;
        ctx.beginPath();
        ctx.ellipse(sx, sy, anchor.w * 0.72, 28, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      const vanishY = viewH * 0.64;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, vanishY, viewW, viewH - vanishY);
      ctx.clip();
      ctx.lineWidth = 1;
      const shift = ((-cameraY * 0.25) % 36 + 36) % 36;
      for (let i = 0; i < 8; i++) {
        const t = i / 7;
        const y = vanishY + t * t * (viewH - vanishY) + shift * t;
        ctx.strokeStyle = `rgba(11, 73, 173, ${0.12 + t * 0.38})`;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(viewW, y);
        ctx.stroke();
      }
      ctx.strokeStyle = "rgba(44, 113, 245, 0.22)";
      for (let i = -7; i <= 7; i++) {
        ctx.beginPath();
        ctx.moveTo(viewW * 0.5, vanishY);
        ctx.lineTo(viewW * 0.5 + i * viewW * 0.11, viewH + 30);
        ctx.stroke();
      }
      ctx.restore();

      const vignette = ctx.createRadialGradient(viewW * 0.5, viewH * 0.42, viewH * 0.18, viewW * 0.5, viewH * 0.5, viewH * 0.78);
      vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
      vignette.addColorStop(1, "rgba(0, 8, 20, 0.78)");
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, viewW, viewH);

      if (noisePattern) {
        ctx.save();
        ctx.globalAlpha = 0.045;
        ctx.fillStyle = noisePattern;
        ctx.fillRect(0, 0, viewW, viewH);
        ctx.restore();
      }
    }

    function drawWorld() {
      const amp = shake > 0 ? shake : 0;
      const ox = amp ? (Math.random() - 0.5) * amp : 0;
      const oy = amp ? (Math.random() - 0.5) * amp : 0;

      ctx.save();
      ctx.translate(ox, oy - cameraY);

      if (mover && blocks.length && (mode === "start" || mode === "playing")) {
        const below = blocks[blocks.length - 1];
        const top = mover.y + mover.h;
        if (below.y > top) {
          ctx.strokeStyle = "rgba(44, 113, 245, 0.16)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(below.x + 0.5, top);
          ctx.lineTo(below.x + 0.5, below.y);
          ctx.moveTo(below.x + below.w - 0.5, top);
          ctx.lineTo(below.x + below.w - 0.5, below.y);
          ctx.stroke();
        }
      }

      for (const block of blocks) {
        const screenY = block.y - cameraY;
        if (screenY > viewH + 120 || screenY + block.h < -120) continue;
        drawPiece(block.x, block.y, block.w, block.h, block.label, 0, 1, {
          cutLeft: block.cutLeft,
          cutRight: block.cutRight,
          glow: block.glow,
          shadow: false,
        });
      }

      for (const bit of debris) {
        drawPiece(bit.x, bit.y, bit.w, bit.h, "", bit.rot, Math.max(0, bit.alpha), {
          cutLeft: bit.cutLeft,
          cutRight: bit.cutRight,
          shadow: false,
        });
      }

      if (falling) {
        drawPiece(falling.x, falling.y, falling.w, falling.h, falling.label, falling.rot, 1, { hot: true });
      } else if (mover) {
        drawPiece(mover.x, mover.y, mover.w, mover.h, mover.label, 0, 1, { hot: true });
      }

      ctx.restore();
    }

    function drawFloaters() {
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = '600 22px "IBM Plex Mono", ui-monospace, monospace';
      for (const floater of floaters) {
        ctx.globalAlpha = Math.max(0, Math.min(1, floater.life));
        ctx.fillStyle = floater.gold ? "#f5db2c" : "#e8f0ff";
        ctx.fillText(floater.text, floater.x, floater.y);
      }
      ctx.restore();
    }

    function paintScore() {
      scoreEl.textContent = String(score);
      scoreEl.style.color = scoreFlash > 0 ? "#f5db2c" : "#e8f0ff";
    }

    function render(time) {
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      drawBackground(time);
      drawWorld();
      drawFloaters();
    }

    function frame(now) {
      if (!lastNow) lastNow = now;
      lastDt = Math.min(0.034, (now - lastNow) / 1000) || lastDt;
      lastNow = now;
      update(lastDt);
      render(now / 1000);
      requestAnimationFrame(frame);
    }

    function saveScore() {
      if (mode !== "gameover") return;
      const initials = initialsInput.value.replace(/\s/g, "").toUpperCase().slice(0, 3);
      initialsInput.value = initials;
      if (initials.length !== 3) {
        initialsInput.style.borderColor = "#f5db2c";
        initialsInput.focus();
        return;
      }

      console.log("Supabase TV leaderboard submission", {
        initials,
        score,
        sessionId,
      });

      const root = document.getElementById("d365-form-wrapper");
      const fields = {
        Game_Score: String(score),
        Arcade_Initials: initials,
        Session_ID: sessionId,
      };
      Object.entries(fields).forEach(([name, value]) => {
        const field = root && root.querySelector(`input[name="${name}"]`);
        if (field) field.value = value;
      });

      setMode("lead");
    }

    document.getElementById("btn-start").addEventListener("click", begin);
    document.getElementById("btn-save").addEventListener("click", saveScore);

    initialsInput.addEventListener("input", () => {
      const clean = initialsInput.value.replace(/\s/g, "").toUpperCase().slice(0, 3);
      if (clean !== initialsInput.value) initialsInput.value = clean;
      initialsInput.style.borderColor = "rgba(255,255,255,0.15)";
    });

    initialsInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        saveScore();
      }
    });

    window.addEventListener("pointerdown", (event) => {
      if (mode !== "playing") return;
      if (event.target.closest("button, input, a, label")) return;
      dropBlock();
    });

    window.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      if (mode === "start" && (event.code === "Space" || event.code === "Enter")) {
        event.preventDefault();
        begin();
      } else if (mode === "playing" && event.code === "Space") {
        event.preventDefault();
        dropBlock();
      }
    });

    window.addEventListener("touchmove", (event) => {
      if (event.target.closest("input, textarea, select")) return;
      event.preventDefault();
    }, { passive: false });

    window.addEventListener("resize", resize);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

    resize();
    makeNoise();
    resetWorld();
    setMode("start");
    if (document.fonts && document.fonts.load) {
      document.fonts.load('500 16px "IBM Plex Mono"');
      document.fonts.load('600 16px Manrope');
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#02060F" />
  <title>Cloud Stacker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Permanent+Marker&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Mulish", "ui-sans-serif", "system-ui", "sans-serif"],
            mono: ["Martian Mono", "ui-monospace", "monospace"],
          },
          colors: {
            main: "#002353",
            secondary: "#0b49ad",
            accent: "#2c71f5",
            gold: "#f5db2c",
          },
        },
      },
    };
  </script>
  <style>
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02060F;
      color: #F4F8FF;
      font-family: Mulish, ui-sans-serif, system-ui, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .is-hidden { display: none !important; }

    #overlay-end, #overlay-end input, #overlay-end button, #panel-lead, #d365-form-wrapper, #d365-form-wrapper * {
      touch-action: auto;
      user-select: text;
      -webkit-user-select: text;
    }

    #panel-lead { -webkit-overflow-scrolling: touch; }

    .cs-pulse { animation: cs-pulse 1.8s ease-out infinite; }
    @keyframes cs-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(0,120,212,.6), 0 12px 32px rgba(0,112,201,.45); }
      100% { box-shadow: 0 0 0 18px rgba(0,120,212,0), 0 12px 32px rgba(0,112,201,.45); }
    }

    #d365-form-wrapper label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #C9D7EC;
    }
    #d365-form-wrapper input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]),
    #d365-form-wrapper select,
    #d365-form-wrapper textarea {
      width: 100%;
      height: 46px;
      box-sizing: border-box;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid #22406E;
      background: #081733;
      color: #F4F8FF;
      font-family: Mulish, ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
    }
    #d365-form-wrapper textarea { height: auto; min-height: 46px; padding: 12px 14px; }
    #d365-form-wrapper input::placeholder,
    #d365-form-wrapper textarea::placeholder { color: #5F7598; }
    #d365-form-wrapper input:focus,
    #d365-form-wrapper select:focus,
    #d365-form-wrapper textarea:focus {
      outline: none;
      border-color: #3AA0FF;
      box-shadow: 0 0 0 4px rgba(0,120,212,.28);
      background: #0A1D42;
    }
    #d365-form-wrapper button,
    #d365-form-wrapper input[type="submit"] {
      height: 54px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #0070C9;
      color: #fff;
      font-family: Mulish, ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      box-shadow: 0 12px 30px rgba(0,112,201,.35);
      cursor: pointer;
    }
    #d365-form-wrapper button:hover,
    #d365-form-wrapper input[type="submit"]:hover { background: #0A7BDA; }

    :root { --chalk: #F2EEE6; --ink: #0A0D14; --pink: #FF3EA5; }

    .mascot { position: fixed; z-index: 35; pointer-events: none; animation: bob 3.2s ease-in-out infinite; }
    .mascot svg, .mascot img { display: none; width: 100%; height: auto; }
    .mascot[data-pose="idle"] .pose-idle,
    .mascot[data-pose="impressed"] .pose-impressed,
    .mascot[data-pose="ouch"] .pose-ouch,
    .mascot[data-pose="miss"] .pose-miss { display: block; }
    .mascot[data-pose="ouch"] svg, .mascot[data-pose="ouch"] img,
    .mascot[data-pose="miss"] svg, .mascot[data-pose="miss"] img { animation: wince .32s ease-in-out 2; }
    @keyframes wince {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px) rotate(-3deg); }
      75% { transform: translateX(3px) rotate(3deg); }
    }
    #mascot.corner { left: 18px; bottom: 66px; width: 60px; }
    #mascot.title { width: 80px; }
    @media (min-width: 900px) {
      #mascot.corner { left: 44px; bottom: 84px; width: 84px; }
      #mascot.title { width: 104px; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .peek { position: absolute; right: 26px; top: -74px; width: 84px; height: auto; pointer-events: none; }
    .wall-clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .wall {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 180vmax;
      height: 180vmax;
      opacity: 0.075;
      transform: translate(-50%, -50%) rotate(-4deg);
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: none;
    }
    .wall div {
      font: 30px/1.12 "Permanent Marker", Mulish, sans-serif;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--chalk);
    }
    .wall.wall-raffle { opacity: 0.06; }
    .wall.is-art {
      display: block;
      background-repeat: repeat;
      background-size: 512px 512px;
    }

    #kicker { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
    #kicker img, [data-logo-slot] img { height: 34px; width: auto; display: block; }
    [data-logo-slot].event-logo { position: relative; overflow: hidden; flex: none; height: 40px; align-self: center; }
    [data-logo-slot].event-logo img { position: absolute; display: block; max-width: none; height: auto; width: auto; }
    #kicker .logo-fallback, [data-logo-slot] .logo-fallback { display: flex; flex-direction: column; gap: 3px; line-height: 1; }
    #kicker .logo-fallback b, [data-logo-slot] .logo-fallback b { font-size: 17px; font-weight: 900; letter-spacing: .02em; color: #F4F8FF; }
    #kicker .logo-fallback b i, [data-logo-slot] .logo-fallback b i { font-style: normal; color: #5BE3FF; }
    #kicker .rule { width: 1px; align-self: stretch; background: rgba(120,170,255,.28); }
    #kicker .when { font-size: 10px; font-weight: 600; letter-spacing: .22em; color: #8DA2C4; line-height: 1.5; white-space: nowrap; }
    #eiffel { position: absolute; pointer-events: none; right: 22px; top: 76px; height: 150px; width: auto; opacity: .2; }
    #headline em { font-style: normal; color: #5BE3FF; }
    @media (min-width: 900px) {
      #eiffel { right: auto; left: 9vw; top: 150px; height: min(190px, 22vh); max-height: calc(50vh - 338px); }
      #kicker img, [data-logo-slot] img { height: 40px; }
      [data-logo-slot].event-logo { height: 52px; }
      [data-logo-slot].event-logo img { height: auto; }
    }
    @media (max-width: 899px) {
      #kicker {
        position: fixed;
        top: calc(max(32px, env(safe-area-inset-top)) + 40px + 16px);
        left: max(28px, env(safe-area-inset-left));
        margin: 0;
        z-index: 40;
      }
      #eiffel { right: 12px; top: 124px; }
    }
    @media (min-width: 900px) and (max-height: 780px) {
      #eiffel { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cs-pulse, .mascot { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Cloud Stacker playfield"></canvas>

  <div class="fixed z-50 pointer-events-none top-[max(32px,env(safe-area-inset-top))] left-[max(28px,env(safe-area-inset-left))] min-[900px]:top-12 min-[900px]:left-[8vw]">
    <img src="assets/promisegroup_logo_white_nobounds.png" alt="Promise Group" class="block h-10 w-auto min-[900px]:h-12">
  </div>

  <div id="mascot" class="mascot title" data-pose="idle" aria-hidden="true"><svg class="pose-idle" width="80" height="96" viewBox="0 0 80 96" role="img" aria-label="Mascot placeholder (on-prem server), idle pose"><path d="M57 16 C60 6 71 5 72 13" stroke="#F2EEE6" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="69" y="12" width="6" height="5" rx="1" fill="#F2EEE6"/><path d="M27 80 V89 M53 80 V89" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"/><path d="M22 90 H31 M49 90 H58" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"/><rect x="12" y="16" width="56" height="65" rx="8" fill="#0A0D14" stroke="#F2EEE6" stroke-width="2"/><rect x="19" y="23" width="42" height="25" rx="4" fill="#F2EEE6"/><path d="M20 57 H50 M20 65 H50 M20 73 H50" stroke="#F2EEE6" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/><circle cx="57" cy="57" r="2" fill="#7CF5FF"/><circle cx="57" cy="65" r="2" fill="#FFB23F"/><path d="M26 33 H35 M44 33 H53" stroke="#0A0D14" stroke-width="2.6" stroke-linecap="round"/><circle cx="33" cy="36.5" r="2" fill="#0A0D14"/><circle cx="51" cy="36.5" r="2" fill="#0A0D14"/><path d="M37 43 H44" stroke="#0A0D14" stroke-width="2" stroke-linecap="round"/></svg><svg class="pose-impressed" width="80" height="96" viewBox="0 0 80 96" role="img" aria-label="Mascot placeholder (on-prem server), impressed pose"><path d="M57 16 C60 6 71 5 72 13" stroke="#F2EEE6" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="69" y="12" width="6" height="5" rx="1" fill="#F2EEE6"/><path d="M27 80 V89 M53 80 V89" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"/><path d="M22 90 H31 M49 90 H58" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"/><rect x="12" y="16" width="56" height="65" rx="8" fill="#0A0D14" stroke="#F2EEE6" stroke-width="2"/><rect x="19" y="23" width="42" height="25" rx="4" fill="#F2EEE6"/><path d="M20 57 H50 M20 65 H50 M20 73 H50" stroke="#F2EEE6" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/><circle cx="57" cy="57" r="2" fill="#7CF5FF"/><circle cx="57" cy="65" r="2" fill="#FFB23F"/><circle cx="31" cy="34" r="4.2" fill="none" stroke="#0A0D14" stroke-width="2"/><circle cx="49" cy="34" r="4.2" fill="none" stroke="#0A0D14" stroke-width="2"/><circle cx="31" cy="34" r="1.6" fill="#0A0D14"/><circle cx="49" cy="34" r="1.6" fill="#0A0D14"/><circle cx="40" cy="43" r="2.2" fill="none" stroke="#0A0D14" stroke-width="1.8"/><path d="M4 20 L10 26 M10 20 L4 26" stroke="#FF3EA5" stroke-width="2.4" stroke-linecap="round"/></svg><svg class="pose-ouch" width="80" height="96" viewBox="0 0 80 96" role="img" aria-label="Mascot placeholder (on-prem server), ouch pose"><path d="M57 16 C60 6 71 5 72 13" stroke="#F2EEE6" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="69" y="12" width="6" height="5" rx="1" fill="#F2EEE6"/><path d="M27 80 V89 M53 80 V89" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"/><path d="M22 90 H31 M49 90 H58" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"/><rect x="12" y="16" width="56" height="65" rx="8" fill="#0A0D14" stroke="#F2EEE6" stroke-width="2"/><rect x="19" y="23" width="42" height="25" rx="4" fill="#F2EEE6"/><path d="M20 57 H50 M20 65 H50 M20 73 H50" stroke="#F2EEE6" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/><circle cx="57" cy="57" r="2" fill="#7CF5FF"/><circle cx="57" cy="65" r="2" fill="#FFB23F"/><path d="M27 29 L35 34 L27 39 M53 29 L45 34 L53 39" stroke="#0A0D14" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M32 44 L34.5 42 L37 44 L39.5 42 L42 44 L44.5 42 L47 44" stroke="#0A0D14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M72 22 Q77 30 72 34 Q67 30 72 22 Z" fill="#7CF5FF"/><path d="M3 22 L10 25 M2 30 L9 30 M3 38 L10 35" stroke="#FF3EA5" stroke-width="2.2" stroke-linecap="round"/></svg><svg class="pose-miss" width="80" height="96" viewBox="0 0 80 96" role="img" aria-label="Mascot placeholder (on-prem server), miss pose"><path d="M57 16 C60 6 71 5 72 13" stroke="#F2EEE6" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="69" y="12" width="6" height="5" rx="1" fill="#F2EEE6"/><path d="M27 80 V89 M53 80 V89" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"/><path d="M22 90 H31 M49 90 H58" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"/><rect x="12" y="16" width="56" height="65" rx="8" fill="#0A0D14" stroke="#F2EEE6" stroke-width="2"/><rect x="19" y="23" width="42" height="25" rx="4" fill="#F2EEE6"/><path d="M20 57 H50 M20 65 H50 M20 73 H50" stroke="#F2EEE6" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/><circle cx="57" cy="57" r="2" fill="#7CF5FF"/><circle cx="57" cy="65" r="2" fill="#FFB23F"/><circle cx="31" cy="33" r="5.4" fill="none" stroke="#0A0D14" stroke-width="2"/><circle cx="49" cy="33" r="5.4" fill="none" stroke="#0A0D14" stroke-width="2"/><circle cx="31" cy="35.6" r="1.7" fill="#0A0D14"/><circle cx="49" cy="35.6" r="1.7" fill="#0A0D14"/><ellipse cx="40" cy="44" rx="3.6" ry="3" fill="#0A0D14"/><path d="M5 8 V19 M5 23 V24 M12 8 V19 M12 23 V24" stroke="#FF3EA5" stroke-width="2.6" stroke-linecap="round"/></svg></div>

  <div id="hud" class="is-hidden pointer-events-none">
    <div class="fixed top-5 right-[22px] flex flex-col items-end gap-1 font-['Martian_Mono']">
      <span class="text-[10px] font-medium tracking-[.32em] text-[#7F93B5]">SCORE</span>
      <span id="score" class="text-[40px] md:text-[64px] font-semibold [font-stretch:87.5%] leading-none tracking-[-0.02em] tabular-nums text-[#F4F8FF]">0</span>
    </div>
    <div id="drop-hint" class="fixed inset-x-0 bottom-[34px] flex items-center justify-center gap-3 font-['Martian_Mono']">
      <span class="relative w-[22px] h-[22px]"><span class="absolute inset-0 rounded-full border-[1.5px] border-[#5BE3FF] animate-ping"></span><span class="absolute left-[7px] top-[7px] w-2 h-2 rounded-full bg-[#5BE3FF]"></span></span>
      <span class="text-[10px] font-medium tracking-[.28em] text-[#A9BDDB]">TAP ANYWHERE TO DROP</span>
    </div>
  </div>

  <section id="overlay-start" class="fixed inset-0 z-30 flex flex-col justify-end min-[900px]:justify-center pointer-events-none">
    <div class="absolute inset-x-0 bottom-0 h-[52%] bg-[linear-gradient(to_bottom,rgba(2,6,15,0)_0%,rgba(2,6,15,.82)_38%,#02060F_70%)] min-[900px]:inset-y-0 min-[900px]:h-auto min-[900px]:w-[60%] min-[900px]:bg-[linear-gradient(to_right,#02060F_0%,rgba(2,6,15,.85)_45%,rgba(2,6,15,0)_100%)]"></div>
    <svg id="eiffel" data-event viewBox="0 0 60 140" fill="none" stroke="#5BE3FF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 140 C14 100 20 70 27 30 L30 6 L33 30 C40 70 46 100 56 140"/><path d="M16 140 C20 118 40 118 44 140"/><path d="M13 108 H47 M20 70 H40 M25 42 H35 M30 6 V0"/><path d="M13 108 L40 70 M47 108 L20 70 M20 70 L35 42 M40 70 L25 42"/></svg>
    <div class="relative w-full max-w-[420px] mx-auto px-6 pb-8 flex flex-col gap-[26px] pointer-events-auto min-[900px]:mx-0 min-[900px]:ml-[8vw] min-[900px]:p-0 min-[900px]:max-w-[460px] min-[900px]:gap-8">
      <div>
        <div id="kicker" data-event>
          <div data-logo-slot><div class="logo-fallback font-['Martian_Mono']"><b>DIRECTIONS <i>EMEA</i></b></div></div>
          <div class="rule"></div>
          <div class="when font-['Martian_Mono']" id="when"></div>
        </div>
        <h1 id="headline" class="font-['Mulish'] text-[44px] min-[900px]:text-[68px] leading-[.95] font-black tracking-[-0.035em] text-[#F4F8FF]"></h1>
        <p id="subhead" class="mt-3.5 text-[15px] min-[900px]:text-[17px] leading-[1.45] text-[#A9BDDB] max-w-[310px] min-[900px]:max-w-[380px]"></p>
      </div>
      <button id="btn-start" type="button" class="cs-pulse h-[60px] w-full min-[900px]:max-w-[340px] rounded-[14px] bg-[#0070C9] hover:bg-[#0A7BDA] text-white font-['Mulish'] text-[15px] font-extrabold tracking-[.16em] uppercase flex items-center justify-center gap-3">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.5" opacity=".5"/></svg>
        Tap to start
      </button>
    </div>
  </section>

  <div id="overlay-end" class="is-hidden">
    <section id="panel-initials" class="fixed inset-0 z-40 flex items-center justify-center p-5 bg-[rgba(2,6,15,.6)] backdrop-blur-[7px] backdrop-saturate-[.8]">
      <div class="wall-clip" aria-hidden="true"><div id="wall-over" class="wall"></div></div>
      <div class="relative w-full max-w-[380px] rounded-[22px] bg-[#061430] border border-[rgba(110,170,255,.22)] shadow-[0_30px_80px_rgba(0,0,0,.6)] px-6 pt-7 pb-6 flex flex-col gap-[22px]">
        <svg class="peek" width="84" height="78" viewBox="0 -6 80 82" role="img" aria-label="Mascot placeholder (on-prem server), peeking over the card"><path d="M57 16 C60 6 71 5 72 13" stroke="#F2EEE6" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="69" y="12" width="6" height="5" rx="1" fill="#F2EEE6"/><path d="M27 80 V89 M53 80 V89" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"/><path d="M22 90 H31 M49 90 H58" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"/><rect x="12" y="16" width="56" height="65" rx="8" fill="#0A0D14" stroke="#F2EEE6" stroke-width="2"/><rect x="19" y="23" width="42" height="25" rx="4" fill="#F2EEE6"/><path d="M20 57 H50 M20 65 H50 M20 73 H50" stroke="#F2EEE6" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/><circle cx="57" cy="57" r="2" fill="#7CF5FF"/><circle cx="57" cy="65" r="2" fill="#FFB23F"/><circle cx="31" cy="34" r="4.2" fill="none" stroke="#0A0D14" stroke-width="2"/><circle cx="49" cy="34" r="4.2" fill="none" stroke="#0A0D14" stroke-width="2"/><circle cx="31" cy="34" r="1.6" fill="#0A0D14"/><circle cx="49" cy="34" r="1.6" fill="#0A0D14"/><circle cx="40" cy="43" r="2.2" fill="none" stroke="#0A0D14" stroke-width="1.8"/><path d="M4 20 L10 26 M10 20 L4 26" stroke="#FF3EA5" stroke-width="2.4" stroke-linecap="round"/><path d="M6 76 C6 67 18 67 18 76 Z M62 76 C62 67 74 67 74 76 Z" fill="#F2EEE6" stroke="#0A0D14" stroke-width="1.5"/></svg>
        <div>
          <div class="flex items-center gap-2 font-['Martian_Mono'] text-[10px] font-semibold tracking-[.34em] text-[#5BE3FF]">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#5BE3FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14V2"/><path d="M3 3h9l-2 3 2 3H3"/></svg>
            <span id="eyebrow"></span>
          </div>
          <h2 id="over-title" class="mt-2.5 font-['Mulish'] text-[36px] leading-none font-black tracking-[-0.02em] text-[#F4F8FF]"></h2>
          <p id="over-sub" class="mt-2 font-['Mulish'] text-[14px] text-[#A9BDDB]"></p>
        </div>
        <div class="flex items-end justify-between gap-3 rounded-[14px] bg-[#0A1D42] px-[18px] pt-[18px] pb-4">
          <div>
            <div class="font-['Martian_Mono'] text-[10px] font-medium tracking-[.3em] text-[#8DA2C4]">FINAL SCORE</div>
            <div id="final-score" class="mt-1.5 font-['Martian_Mono'] text-[54px] font-semibold [font-stretch:87.5%] leading-[.95] tracking-[-0.03em] tabular-nums text-white">0</div>
          </div>
          <div class="flex flex-col items-end gap-1 pb-1 text-[13px] text-[#A9BDDB]">
            <span><b class="text-[#F4F8FF]" id="floors">0</b> floors</span>
            <span><b class="text-[#5BE3FF]" id="perfects">0</b> perfect</span>
          </div>
        </div>
        <div>
          <label for="initials" class="block mb-3 text-[14px] font-semibold text-[#DCE8FA]">Your initials for the leaderboard</label>
          <input id="initials" maxlength="3" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Your initials for the leaderboard" class="w-full h-[76px] rounded-xl bg-[#0B2350] border-[1.5px] border-[#3AA0FF] shadow-[0_0_0_4px_rgba(0,120,212,.28)] text-white text-center uppercase font-['Martian_Mono'] text-[38px] font-semibold tracking-[.5em] pl-[.5em] outline-none">
        </div>
        <button id="btn-save" type="button" class="h-[58px] rounded-[14px] bg-[#0070C9] hover:bg-[#0A7BDA] text-white font-['Mulish'] text-[15px] font-extrabold tracking-[.16em] uppercase shadow-[0_12px_30px_rgba(0,112,201,.4)]">Save score</button>
      </div>
    </section>

    <section id="panel-lead" class="is-hidden fixed inset-0 z-40 overflow-y-auto bg-[radial-gradient(120%_60%_at_50%_0%,#0B3470_0%,#071D45_34%,#040C22_66%,#02060F_100%)]">
      <div class="wall-clip" aria-hidden="true"><div id="wall-raffle" class="wall wall-raffle"></div></div>
      <div class="relative z-10 max-w-[420px] mx-auto px-5 pt-[96px] min-[900px]:pt-[120px] pb-6 flex flex-col gap-[22px]">
        <div class="self-start flex items-center gap-2.5 rounded-full bg-[#0A1D42] border border-[rgba(91,227,255,.25)] py-2 pl-2.5 pr-3.5">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="#5BE3FF" opacity=".16"/><path d="M5.2 9.3l2.4 2.3 5.2-5.2" stroke="#5BE3FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="chip-initials" class="font-['Martian_Mono'] text-xs font-semibold tracking-[.12em]">AAA</span>
          <span class="w-px h-3.5 bg-[#2A4676]"></span>
          <span id="chip-score" class="font-['Martian_Mono'] text-xs font-semibold tabular-nums">0</span>
          <span class="text-xs text-[#A9BDDB]">saved</span>
        </div>
        <div>
          <div data-event data-logo-slot class="mb-3"><div class="logo-fallback font-['Martian_Mono']"><b>DIRECTIONS <i>EMEA</i></b></div></div>
          <h1 class="font-['Mulish'] text-[36px] leading-[.98] font-black tracking-[-0.035em] text-[#F4F8FF]">Enter the prize raffle!</h1>
          <p class="mt-2.5 text-[15px] leading-[1.45] text-[#A9BDDB]">Leave your details for a chance to win <span class="text-[#F4F8FF] font-semibold">[PRIZE]</span>.</p>
        </div>
        <div id="d365-form-wrapper" class="rounded-[18px] border border-dashed border-[rgba(120,170,255,.38)] bg-[rgba(6,20,48,.55)] p-4 text-center text-sm text-[#7F93B5]">CRM Form Goes Here</div>
        <p class="text-center text-xs text-[#7F93B5]">After you submit, the game resets for the next player.</p>
      </div>
    </section>
  </div>

  <script src="event-config.js?v=emea"></script>
  <script src="stack-renderer.js"></script>
  <script>
    const T = window.THEME;
    const LABELS = T.labels;
    const ATTRACT_ROWS = [[0, 170], [0, 170], [6, 164], [6, 164], [10, 160], [10, 160], [10, 152], [14, 148]];
    const GRAVITY = 2800;
    const MAX_SPEED = 420;

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    const hud = document.getElementById("hud");
    const scoreEl = document.getElementById("score");
    const overlayStart = document.getElementById("overlay-start");
    const mascot = document.getElementById("mascot");
    const overlayEnd = document.getElementById("overlay-end");
    const panelInitials = document.getElementById("panel-initials");
    const panelLead = document.getElementById("panel-lead");
    const finalScoreEl = document.getElementById("final-score");
    const initialsInput = document.getElementById("initials");

    const sessionId = typeof crypto.randomUUID === "function"
      ? crypto.randomUUID()
      : Array.from(crypto.getRandomValues(new Uint8Array(16)), (byte, index) => {
          if (index === 6) byte = (byte & 0x0f) | 0x40;
          if (index === 8) byte = (byte & 0x3f) | 0x80;
          return byte.toString(16).padStart(2, "0");
        }).join("").replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/, "$1-$2-$3-$4-$5");

    let viewW = 1;
    let viewH = 1;
    let pixelRatio = 1;
    let mode = "start";
    let score = 0;
    let perfects = 0;
    let scoreFlash = 0;
    let cameraY = 0;
    let hSpeed = 155;
    let blockH = 64;
    let shake = 0;
    let spawnSide = 1;
    let lastDt = 1 / 60;
    let lastNow = 0;
    let blocks = [];
    let debris = [];
    let floaters = [];
    let mover = null;
    let falling = null;
    let sceneK = 1;
    let backdrop = null;
    let grain = null;
    let floor = null;
    let motes = null;
    let view = null;
    let clock = 0;
    let fx = [];
    let shards = [];
    let shakeT0 = -1;
    let spawnAt = -1;
    let pendingWidth = 0;
    let gameOverAt = -1;
    let scoreCyanUntil = 0;
    let attractStack = null;
    let attractActive = null;
    let attractDir = 1;
    let poseUntil = 0;
    let xSprites = null;
    let cutSprite = null;

    const R = StackRenderer;
    const GEOM = R.GEOM;

    function randomLabel() {
      return LABELS[(Math.random() * LABELS.length) | 0];
    }

    function resize() {
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(viewW * pixelRatio));
      canvas.height = Math.max(1, Math.round(viewH * pixelRatio));
      sceneK = R.scaleFor(viewW, viewH);
      backdrop = R.buildBackdrop(viewW, viewH, sceneK, pixelRatio);
      floor = R.buildFloor(sceneK, pixelRatio);
      motes = R.makeMotes(viewW, viewH);
      const ox = R.centredOriginX(viewW, sceneK);
      if (!view) view = R.makeView(ox, viewH * 0.46, sceneK);
      else view.k = sceneK;
      fillWalls();
    }

    function worldPerUnit() {
      return GEOM.baseW / blocks[0].w;
    }

    function toWorld(blk, i) {
      const scale = worldPerUnit();
      return {
        x0: (blk.x - blocks[0].x) * scale,
        w: blk.w * scale,
        y0: GEOM.baseH + i * GEOM.blockH,
        h: GEOM.blockH,
        label: blk.label,
      };
    }

    function pieceWorld(piece, y0) {
      const scale = worldPerUnit();
      return {
        x0: (piece.x - blocks[0].x) * scale,
        w: piece.w * scale,
        y0,
        h: GEOM.blockH,
        label: piece.label,
      };
    }

    function spanWorld(x, w) {
      const scale = worldPerUnit();
      return {
        x0: (x - blocks[0].x) * scale,
        w: w * scale,
      };
    }

    function flashAmount(block) {
      if (block.flashT0 == null || block.flashT0 < 0) return 0;
      const age = clock - block.flashT0;
      if (age < 0.12) return 1;
      return Math.max(0, 1 - (age - 0.12) / 0.25);
    }

    function cutAmount(block) {
      if (block.cutT0 == null || block.cutT0 < 0) return 0;
      return Math.max(0, 1 - (clock - block.cutT0) / 0.45) * 0.9;
    }

    function activeWorld(top) {
      const hoverY = top.y0 + top.h + GEOM.hover;
      if (falling) {
        const lane = Math.max(104, viewH * 0.155);
        const landScreen = (blocks[blocks.length - 1].y - cameraY) - falling.h;
        const nowScreen = falling.y - cameraY;
        const span = landScreen - lane || 1;
        let progress = (nowScreen - lane) / span;
        if (!falling.miss) progress = Math.max(0, Math.min(1, progress));
        return pieceWorld(falling, hoverY + (top.y0 + top.h - hoverY) * progress);
      }
      if (mover) return pieceWorld(mover, hoverY);
      return null;
    }

    function buildAttract() {
      attractStack = ATTRACT_ROWS.map(([x0, w], i) => ({
        x0,
        w,
        y0: GEOM.baseH + i * GEOM.blockH,
        h: GEOM.blockH,
        label: LABELS[i % LABELS.length],
        flashT0: -1,
        cutT0: -1,
      }));
      const top = attractStack[attractStack.length - 1];
      const range = viewW < 600 ? 110 : 150;
      attractDir = 1;
      attractActive = {
        x0: top.x0 - range,
        w: top.w,
        y0: top.y0 + top.h + GEOM.hover,
        h: GEOM.blockH,
        label: LABELS[ATTRACT_ROWS.length % LABELS.length],
      };
    }

    function updateAttract(dt) {
      if (!attractStack) buildAttract();
      const top = attractStack[attractStack.length - 1];
      const range = viewW < 600 ? 110 : 150;
      attractActive.w = top.w;
      attractActive.y0 = top.y0 + top.h + GEOM.hover;
      attractActive.x0 += attractDir * 90 * dt;
      if (attractActive.x0 > top.x0 + range) {
        attractActive.x0 = top.x0 + range;
        attractDir = -1;
      } else if (attractActive.x0 < top.x0 - range) {
        attractActive.x0 = top.x0 - range;
        attractDir = 1;
      }
    }

    function viewTop() {
      if (mode === "start" && attractStack && attractStack.length) {
        return attractStack[attractStack.length - 1];
      }
      if (!blocks.length) return null;
      return toWorld(blocks[blocks.length - 1], blocks.length - 1);
    }

    function easeView(dt) {
      const top = viewTop();
      if (!view || !top) return;
      const anchor = mode === "start" ? (viewW >= 900 ? 0.30 : 0.24) : 0.46;
      const targetOy = viewH * anchor + (top.y0 + top.h - top.x0 * 0.5) * sceneK;
      const targetOx = R.centredOriginX(viewW, sceneK) + (mode === "start" && viewW >= 900 ? viewW * 0.16 : 0);
      const ease = Math.min(1, dt * 5);
      view.oy += (targetOy - view.oy) * ease;
      view.ox += (targetOx - view.ox) * ease;
      view.k = sceneK;
    }

    function resetWorld() {
      blockH = Math.round(Math.min(70, Math.max(52, viewH * 0.06)));
      const width = Math.round(Math.max(168, Math.min(viewW * 0.46, viewW - 64)));
      blocks = [{
        x: (viewW - width) / 2,
        y: viewH - blockH - Math.round(viewH * 0.075),
        w: width,
        h: blockH,
        label: randomLabel(),
        cutLeft: false,
        cutRight: false,
        glow: 0,
        flashT0: -1,
        cutT0: -1,
      }];
      cameraY = 0;
      debris = [];
      floaters = [];
      falling = null;
      shake = 0;
      score = 0;
      perfects = 0;
      scoreFlash = 0;
      fx = [];
      shards = [];
      shakeT0 = -1;
      spawnAt = -1;
      pendingWidth = 0;
      gameOverAt = -1;
      scoreCyanUntil = 0;
      hSpeed = 155;
      spawnSide = 1;
      spawnMover(width);
      paintScore();
      syncHint();
    }

    function syncHint() {
      const hint = document.getElementById("drop-hint");
      if (hint) hint.classList.toggle("is-hidden", blocks.length > 4);
    }

    function spawnMover(width) {
      const fromLeft = spawnSide > 0;
      spawnSide *= -1;
      mover = {
        x: fromLeft ? 18 : viewW - width - 18,
        y: 0,
        w: width,
        h: blockH,
        label: randomLabel(),
        dir: fromLeft ? 1 : -1,
      };
    }

    function setPose(pose, dur) {
      mascot.dataset.pose = pose;
      poseUntil = dur ? clock + dur : 0;
    }

    function mascotMode(next) {
      mascot.classList.toggle("is-hidden", next === "hidden");
      mascot.classList.toggle("title", next === "title");
      mascot.classList.toggle("corner", next === "corner");
      if (next !== "title") {
        mascot.style.left = "";
        mascot.style.top = "";
      }
      setPose("idle");
    }

    function placeTitleMascot() {
      if (!view) return;
      const point = view.p(GEOM.baseW, 40, 0);
      const height = mascot.offsetHeight || 96;
      mascot.style.left = `${point[0] + 6}px`;
      mascot.style.top = `${point[1] - height}px`;
    }

    function opaqueBox(img) {
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      const { data, width, height } = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let minx = width;
      let miny = height;
      let maxx = 0;
      let maxy = 0;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (data[(y * width + x) * 4 + 3] <= 16) continue;
          if (x < minx) minx = x;
          if (y < miny) miny = y;
          if (x > maxx) maxx = x;
          if (y > maxy) maxy = y;
        }
      }
      if (maxx < minx) return { minx: 0, miny: 0, maxx: width - 1, maxy: height - 1, width, height };
      return { minx, miny, maxx, maxy, width, height };
    }

    function placeEventLogo(slot, img, box) {
      const contentW = box.maxx - box.minx + 1;
      const contentH = box.maxy - box.miny + 1;
      slot.classList.add("event-logo");
      slot.style.aspectRatio = `${contentW} / ${contentH}`;
      slot.replaceChildren(img);
      img.style.height = `${(box.height / contentH) * 100}%`;
      img.style.width = "auto";
      img.style.maxWidth = "none";
      img.style.left = `${(-box.minx / contentW) * 100}%`;
      img.style.top = `${(-box.miny / contentH) * 100}%`;
    }

    function applyTheme() {
      document.getElementById("headline").innerHTML = T.headline;
      document.getElementById("subhead").textContent = T.subhead;
      document.getElementById("eyebrow").textContent = T.eyebrow;
      if (!T.isEvent) {
        document.querySelectorAll("[data-event]").forEach((el) => el.remove());
        return;
      }
      const when = document.getElementById("when");
      if (when) when.textContent = T.kicker;
      if (!T.logoSrc) return;
      const probe = new Image();
      probe.onload = () => {
        const box = opaqueBox(probe);
        document.querySelectorAll("[data-logo-slot]").forEach((slot) => {
          const img = new Image();
          img.alt = "Directions EMEA 2026";
          img.onload = () => placeEventLogo(slot, img, box);
          img.src = probe.src;
        });
      };
      probe.src = T.logoSrc;
    }

    function fillWall(el) {
      if (el.classList.contains("is-art")) return;
      const phrase = T.wall;
      const long = phrase.repeat(40);
      const lineHeight = 30 * 1.12 + 2;
      const cover = Math.max(window.innerWidth, window.innerHeight) * 1.85;
      const count = Math.ceil(cover / lineHeight) + 4;
      el.innerHTML = Array.from({ length: count }, (_, i) => `<div>${long.slice((i * 7) % phrase.length)}</div>`).join("");
    }

    function fillWalls() {
      document.querySelectorAll(".wall").forEach(fillWall);
    }

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img.naturalWidth ? img : null);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function loadArt() {
      const base = "/assets/art/";
      Promise.all([1, 2, 3, 4].map((n) => loadImage(`${base}x-${n}.png`))).then((marks) => {
        const loaded = marks.filter(Boolean);
        if (!loaded.length) return;
        xSprites = {
          pink: loaded.map((img) => R.tintSprite(img, R.ART.pink)),
          chalk: loaded.map((img) => R.tintSprite(img, R.ART.chalk)),
        };
        cutSprite = xSprites.chalk[0];
      });
      [["idle", "mascot-idle.png"], ["impressed", "mascot-impressed.png"], ["ouch", "mascot-ouch.png"], ["miss", "mascot-miss.png"]].forEach(([pose, file]) => {
        loadImage(base + file).then((img) => {
          if (!img) return;
          img.className = `pose-${pose}`;
          img.alt = "";
          const stand = mascot.querySelector(`.pose-${pose}`);
          if (stand) stand.replaceWith(img);
        });
      });
      loadImage(base + "mascot-peek.png").then((img) => {
        if (!img) return;
        img.className = "peek";
        img.alt = "";
        const stand = document.querySelector("#panel-initials .peek");
        if (stand) stand.replaceWith(img);
      });
      loadImage(base + "wall.png").then((img) => {
        if (!img) return;
        document.querySelectorAll(".wall").forEach((el) => {
          el.classList.add("is-art");
          el.style.backgroundImage = `url("${img.src}")`;
          el.textContent = "";
        });
      });
    }

    function setMode(next) {
      mode = next;
      if (next === "start") mascotMode("title");
      else if (next === "playing") mascotMode("corner");
      else mascotMode("hidden");
      overlayStart.classList.toggle("is-hidden", next !== "start");
      hud.classList.toggle("is-hidden", next !== "playing");
      overlayEnd.classList.toggle("is-hidden", next !== "gameover" && next !== "lead");
      panelInitials.classList.toggle("is-hidden", next !== "gameover");
      panelLead.classList.toggle("is-hidden", next !== "lead");
      if (next === "gameover") {
        finalScoreEl.textContent = score.toLocaleString("en-US");
        const floorsEl = document.getElementById("floors");
        const perfectsEl = document.getElementById("perfects");
        const floorsN = blocks.length;
        const ending = T.endings.filter((entry) => entry.min <= floorsN).pop();
        document.getElementById("over-title").textContent = ending.title;
        document.getElementById("over-sub").textContent = ending.sub;
        if (floorsEl) floorsEl.textContent = String(floorsN);
        if (perfectsEl) perfectsEl.textContent = String(perfects);
        initialsInput.value = "";
        initialsInput.style.borderColor = "#3AA0FF";
        requestAnimationFrame(() => initialsInput.focus());
      }
      if (next === "lead") {
        const chipInitials = document.getElementById("chip-initials");
        const chipScore = document.getElementById("chip-score");
        if (chipInitials) chipInitials.textContent = initialsInput.value || "AAA";
        if (chipScore) chipScore.textContent = score.toLocaleString("en-US");
      }
    }

    function begin() {
      if (mode !== "start") return;
      resetWorld();
      setMode("playing");
    }

    function perfectWindow() {
      return Math.max(4, hSpeed * lastDt * 0.5);
    }

    function dropBlock() {
      if (mode !== "playing" || !mover || falling || spawnAt >= 0 || gameOverAt >= 0) return;
      falling = {
        x: mover.x,
        y: mover.y,
        w: mover.w,
        h: mover.h,
        label: mover.label,
        vy: 90,
        rot: 0,
        miss: false,
        missDir: 1,
      };
      mover = null;
    }

    function placeBlock(piece, below, left, right) {
      const aligned = Math.abs(piece.x - below.x) <= perfectWindow();
      let x = left;
      let w = right - left;
      let cutLeft = piece.x < left - 0.4;
      let cutRight = piece.x + piece.w > right + 0.4;

      if (aligned) {
        x = below.x;
        w = below.w;
        cutLeft = false;
        cutRight = false;
        score += 500;
        perfects += 1;
        scoreCyanUntil = clock + 0.12;
        shakeT0 = clock;
      } else {
        score += 100;
      }

      blocks.push({
        x,
        y: piece.y,
        w,
        h: piece.h,
        label: piece.label,
        cutLeft,
        cutRight,
        glow: 0,
        flashT0: aligned ? clock : -1,
        cutT0: cutRight ? clock : -1,
      });
      const placed = toWorld(blocks[blocks.length - 1], blocks.length - 1);
      if (aligned) {
        setPose("impressed", 0.9);
        fx.push({ type: "rings", t0: clock, dur: 0.6, block: placed });
        fx.push({ type: "xs", t0: clock, dur: 0.6, block: placed });
        fx.push({ type: "popup", t0: clock, dur: 0.9, kind: "perfect", block: placed });
      } else {
        if (cutLeft && left - piece.x >= 0.75) {
          const span = spanWorld(piece.x, left - piece.x);
          shards.push({ x0: span.x0, w: span.w, y0: placed.y0, h: GEOM.blockH, side: "left", t0: clock });
        }
        if (cutRight && piece.x + piece.w - right >= 0.75) {
          const span = spanWorld(right, piece.x + piece.w - right);
          shards.push({ x0: span.x0, w: span.w, y0: placed.y0, h: GEOM.blockH, side: "right", t0: clock });
        }
        const cutX = cutRight ? placed.x0 + placed.w : placed.x0;
        fx.push({ type: "cut", t0: clock, dur: 0.25, x: cutX, y0: placed.y0, h: GEOM.blockH });
        fx.push({ type: "cutx", t0: clock, dur: 0.4, x: cutX, y0: placed.y0, h: GEOM.blockH });
        setPose("ouch", 0.9);
        fx.push({ type: "popup", t0: clock, dur: 0.9, kind: "slice", block: placed });
      }
      hSpeed = Math.min(MAX_SPEED, hSpeed + 18);
      pendingWidth = w;
      spawnAt = clock + 0.3;
      paintScore();
      syncHint();
    }

    function updateMover(dt) {
      const lane = Math.max(104, viewH * 0.155);
      mover.y = cameraY + lane;
      mover.x += mover.dir * hSpeed * dt;
      const minX = 12;
      const maxX = viewW - mover.w - 12;
      if (maxX <= minX) {
        mover.x = (viewW - mover.w) / 2;
        return;
      }
      if (mover.x <= minX) {
        mover.x = minX;
        mover.dir = 1;
      } else if (mover.x >= maxX) {
        mover.x = maxX;
        mover.dir = -1;
      }
    }

    function updateFalling(dt) {
      falling.vy = Math.min(1700, falling.vy + GRAVITY * dt);
      falling.y += falling.vy * dt;
      if (falling.miss) falling.rot += falling.missDir * dt * 2.4;

      const below = blocks[blocks.length - 1];
      if (!falling.miss && falling.y + falling.h >= below.y) {
        const left = Math.max(falling.x, below.x);
        const right = Math.min(falling.x + falling.w, below.x + below.w);
        if (right - left <= 0) {
          const missDir = falling.x + falling.w / 2 < below.x + below.w / 2 ? -1 : 1;
          const top = toWorld(below, blocks.length - 1);
          const span = spanWorld(falling.x, falling.w);
          shards.push({
            x0: span.x0,
            w: span.w,
            y0: top.y0 + top.h,
            h: GEOM.blockH,
            side: missDir < 0 ? "left" : "right",
            t0: clock,
          });
          falling = null;
          spawnAt = -1;
          gameOverAt = clock + 0.75;
          setPose("miss");
          return;
        } else {
          falling.y = below.y - falling.h;
          placeBlock(falling, below, left, right);
          falling = null;
          return;
        }
      }

      if (falling && falling.y - cameraY > viewH + falling.h + 60) {
        falling = null;
        setMode("gameover");
      }
    }

    function easeCamera(dt) {
      const top = blocks[blocks.length - 1];
      const target = viewH * 0.62;
      if (top.y - cameraY < target) {
        const desired = top.y - target;
        cameraY += (desired - cameraY) * Math.min(1, dt * 2.6);
      }
    }

    function update(dt) {
      const attract = mode === "start" || mode === "playing";
      if (falling && (mode === "playing" || falling.miss)) updateFalling(dt);
      if (spawnAt >= 0 && clock >= spawnAt && mode === "playing" && gameOverAt < 0) {
        spawnMover(pendingWidth);
        spawnAt = -1;
      }
      if (mode === "start") updateAttract(dt);
      else if (!falling && mover && attract) updateMover(dt);
      if (blocks.length) easeCamera(dt);
      easeView(dt);
      if (poseUntil && clock > poseUntil) setPose("idle");
      if (mode === "start") placeTitleMascot();
      if (gameOverAt >= 0 && clock >= gameOverAt && mode === "playing") {
        gameOverAt = -1;
        setMode("gameover");
      }
      paintScore();
    }

    function paintScore() {
      const cyan = clock < scoreCyanUntil;
      scoreEl.textContent = score.toLocaleString("en-US");
      scoreEl.style.color = cyan ? "#5BE3FF" : "#F4F8FF";
      scoreEl.style.textShadow = cyan ? "0 0 18px rgba(91,227,255,.6)" : "none";
    }

    function render(time) {
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      if (backdrop) ctx.drawImage(backdrop, 0, 0, viewW, viewH);
      if (!blocks.length || !view) {
        if (grain) R.drawGrain(ctx, grain, viewW, viewH);
        return;
      }

      const showingAttract = mode === "start" && attractStack;
      const cloud = showingAttract
        ? attractStack.map((world) => ({ world, flash: 0, cut: 0 }))
        : blocks.map((block, i) => ({ world: toWorld(block, i), flash: flashAmount(block), cut: cutAmount(block) }));
      const topIndex = cloud.length - 1;
      const top = cloud[topIndex].world;

      const stackTop = view.p(top.x0 + top.w / 2, GEOM.depth / 2, top.y0 + top.h);
      R.drawAtmosphere(ctx, viewW, viewH, sceneK, time, stackTop[0], stackTop[1]);

      ctx.save();
      if (shakeT0 >= 0) {
        const [sx, sy] = R.shakeOffset((clock - shakeT0) / 0.3, sceneK);
        ctx.translate(sx, sy);
      }

      if (floor && view.oy + 160 * sceneK > 0 && view.oy - 200 * sceneK < viewH) {
        R.drawFloor(ctx, floor, view);
      }

      const base = { x0: 0, w: GEOM.baseW, y0: 0, h: GEOM.baseH, label: T.baseLabel };
      const baseScreenY = view.p(base.x0, 0, base.y0)[1];
      if (baseScreenY - 120 * sceneK <= viewH) {
        R.drawBlock(ctx, view, base, { kind: "base" });
      }

      for (let i = 0; i <= topIndex; i++) {
        const entry = cloud[i];
        const yScreen = view.p(entry.world.x0, 0, entry.world.y0)[1];
        if (yScreen - 120 * sceneK > viewH) continue;
        R.drawBlock(ctx, view, entry.world, {
          kind: "cloud",
          t: 1 - (topIndex - i) / 12,
          flash: entry.flash,
          cut: entry.cut,
        });
      }

      const active = showingAttract ? attractActive : activeWorld(top);
      const showActive = active && (showingAttract || mode === "playing");
      if (showActive && !showingAttract && mover && !falling && mode === "playing") {
        R.drawDropGuide(ctx, view, top, active);
        R.drawTrail(ctx, view, active, mover.dir);
      }
      if (showActive) R.drawBlock(ctx, view, active, { kind: "active" });

      for (const effect of fx) {
        const progress = (clock - effect.t0) / effect.dur;
        const markP = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? Math.max(progress, 0.25) : progress;
        if (effect.type === "rings") R.drawPerfectRings(ctx, view, effect.block, progress);
        if (effect.type === "xs") R.drawPerfectXs(ctx, view, effect.block, markP, xSprites);
        if (effect.type === "cut") R.drawCutLine(ctx, view, effect.x, effect.y0, effect.h, progress);
        if (effect.type === "cutx") R.drawCutXs(ctx, view, effect.x, effect.y0, effect.h, progress, cutSprite);
      }
      shards = shards.filter((shard) => R.drawShard(ctx, view, shard, clock - shard.t0));

      ctx.restore();

      if (motes) R.drawMotes(ctx, motes, time, sceneK);
      R.drawFog(ctx, viewW, viewH, sceneK);

      for (const effect of fx) {
        if (effect.type !== "popup") continue;
        const block = effect.block;
        const point = view.p(block.x0 + block.w / 2, GEOM.depth / 2, block.y0 + block.h);
        const x = effect.kind === "slice" ? Math.min(point[0] + 70 * sceneK, viewW - 60 * sceneK) : point[0];
        R.drawPopup(ctx, x, point[1] - 70 * sceneK, effect.kind, (clock - effect.t0) / effect.dur, sceneK);
      }
      fx = fx.filter((effect) => clock - effect.t0 < effect.dur);

      if (grain) R.drawGrain(ctx, grain, viewW, viewH);
    }

    function frame(now) {
      if (!lastNow) lastNow = now;
      lastDt = Math.min(0.034, (now - lastNow) / 1000) || lastDt;
      lastNow = now;
      clock = now / 1000;
      update(lastDt);
      render(clock);
      requestAnimationFrame(frame);
    }

    function saveScore() {
      if (mode !== "gameover") return;
      const initials = initialsInput.value.replace(/\s/g, "").toUpperCase().slice(0, 3);
      initialsInput.value = initials;
      if (initials.length !== 3) {
        initialsInput.style.borderColor = "#FFB23F";
        initialsInput.focus();
        return;
      }

      console.log("Supabase TV leaderboard submission", {
        initials,
        score,
        sessionId,
      });

      const root = document.getElementById("d365-form-wrapper");
      const fields = {
        Game_Score: String(score),
        Arcade_Initials: initials,
        Session_ID: sessionId,
      };
      Object.entries(fields).forEach(([name, value]) => {
        const field = root && root.querySelector(`input[name="${name}"]`);
        if (field) field.value = value;
      });

      setMode("lead");
    }

    document.getElementById("btn-start").addEventListener("click", begin);
    document.getElementById("btn-save").addEventListener("click", saveScore);

    initialsInput.addEventListener("input", () => {
      const clean = initialsInput.value.replace(/\s/g, "").toUpperCase().slice(0, 3);
      if (clean !== initialsInput.value) initialsInput.value = clean;
      initialsInput.style.borderColor = "#3AA0FF";
    });

    initialsInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        saveScore();
      }
    });

    window.addEventListener("pointerdown", (event) => {
      if (mode !== "playing") return;
      if (event.target.closest("button, input, a, label")) return;
      dropBlock();
    });

    window.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      if (mode === "start" && (event.code === "Space" || event.code === "Enter")) {
        event.preventDefault();
        begin();
      } else if (mode === "playing" && event.code === "Space") {
        event.preventDefault();
        dropBlock();
      }
    });

    window.addEventListener("touchmove", (event) => {
      if (event.target.closest("input, textarea, select")) return;
      event.preventDefault();
    }, { passive: false });

    window.addEventListener("resize", resize);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

    grain = StackRenderer.buildGrain();
    resize();
    buildAttract();
    resetWorld();
    loadArt();
    applyTheme();
    setMode("start");
    const startLoop = () => requestAnimationFrame(frame);
    const fontsReady = document.fonts
      ? Promise.all([
          document.fonts.load("500 8px 'Martian Mono'"),
          document.fonts.load("900 46px 'Mulish'"),
        ]).catch(() => {})
      : Promise.resolve();
    fontsReady.then(startLoop, startLoop);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloud Stacker — Play</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Martian+Mono:wdth,wght@75..112.5,100..800&amp;display=swap">
<style>
body{margin:0}
.layer{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lbl{font-family:'Martian Mono',ui-monospace,monospace;font-size:8px;font-weight:500;letter-spacing:.14em;fill:rgba(240,248,255,.9)}
.neon{filter:drop-shadow(0 0 3px rgba(91,227,255,.9))}
.glowA{filter:drop-shadow(0 0 16px rgba(91,227,255,.55))}
.m1{animation:rise 9s linear infinite}
.m2{animation:rise 11s linear infinite -4s}
.m3{animation:rise 13s linear infinite -8s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-170px);opacity:0}}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.tap{animation:tap 1.6s ease-out infinite;transform-origin:center}
@keyframes tap{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #02060F; font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif; color: #F4F8FF">

<div style="position: absolute; inset: 0; background: radial-gradient(130% 75% at 50% 40%, #0B3470 0%, #071D45 36%, #040C22 68%, #02060F 100%)"></div>
<div style="position: absolute; left: -70px; top: 170px; width: 530px; height: 400px; background: radial-gradient(closest-side, rgba(0,120,212,.55), rgba(0,120,212,0))"></div>

<svg class="layer" width="390" height="844" aria-hidden="true">
<defs>
<pattern id="p-lat" width="38.1" height="22" patternUnits="userSpaceOnUse"><path d="M0,0 L38.1,22 M38.1,0 L0,22" stroke="#6AB4FF" stroke-width="0.5" fill="none"></path></pattern>
<radialGradient id="p-latFade" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff" stop-opacity="1"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
<mask id="p-latMask"><rect width="390" height="844" fill="url(#p-latFade)"></rect></mask>
<linearGradient id="p-sheen" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.32"></stop><stop offset="0.65" stop-color="#fff" stop-opacity="0"></stop></linearGradient>
<linearGradient id="p-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.10"></stop><stop offset="1" stop-color="#000" stop-opacity="0.32"></stop></linearGradient>
</defs>
<rect width="390" height="844" fill="url(#p-lat)" mask="url(#p-latMask)" opacity="0.09"></rect>
</svg>

<div class="drift" style="position: absolute; left: -90px; top: 120px; width: 300px; height: 90px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,195,255,.18), rgba(150,195,255,0)); filter: blur(8px)"></div>
<div class="drift" style="position: absolute; right: -110px; top: 250px; width: 330px; height: 100px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,195,255,.14), rgba(150,195,255,0)); filter: blur(10px)"></div>
<div style="position: absolute; left: 70px; top: 60px; width: 250px; height: 320px; background: linear-gradient(to top, rgba(91,227,255,.18), rgba(91,227,255,0)); filter: blur(22px)"></div>

<sc-for list="{{blocks}}" as="b" hint-placeholder-count="13">
<svg class="layer" width="390" height="844" aria-hidden="true">
<polygon points="{{b.left}}" fill="{{b.cLeft}}"></polygon>
<polygon points="{{b.left}}" fill="url(#p-side)"></polygon>
<polygon points="{{b.right}}" fill="{{b.cRight}}"></polygon>
<polygon points="{{b.top}}" fill="{{b.cTop}}"></polygon>
<polygon points="{{b.top}}" fill="url(#p-sheen)"></polygon>
<polyline class="neon" points="{{b.edge}}" fill="none" stroke="{{b.cEdge}}" stroke-width="1.2" stroke-linejoin="round" opacity="{{b.op}}"></polyline>
<text transform="{{b.tx}}" class="lbl">{{b.label}}</text>
<circle cx="{{b.d1x}}" cy="{{b.d1y}}" r="1.4" fill="#7CF5FF"></circle>
<circle cx="{{b.d2x}}" cy="{{b.d2y}}" r="1.4" fill="#7CF5FF" opacity="0.4"></circle>
</svg>
</sc-for>

<svg class="layer" width="390" height="844" aria-hidden="true">
<polygon points="{{shadow}}" fill="#00081C" opacity="0.42"></polygon>
<path d="{{rails}}" stroke="#5BE3FF" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"></path>
<polygon points="{{g2.top}}" fill="#8FE6FF" opacity="0.05"></polygon>
<polygon points="{{g2.left}}" fill="#8FE6FF" opacity="0.04"></polygon>
<polygon points="{{g1.top}}" fill="#8FE6FF" opacity="0.10"></polygon>
<polygon points="{{g1.left}}" fill="#8FE6FF" opacity="0.08"></polygon>
</svg>

<svg class="layer glowA" width="390" height="844" aria-hidden="true">
<polygon points="{{act.left}}" fill="hsl(204,78%,34%)"></polygon>
<polygon points="{{act.left}}" fill="url(#p-side)"></polygon>
<polygon points="{{act.right}}" fill="hsl(206,80%,22%)"></polygon>
<polygon points="{{act.top}}" fill="hsl(194,100%,74%)"></polygon>
<polygon points="{{act.top}}" fill="url(#p-sheen)"></polygon>
<polyline class="neon" points="{{act.edge}}" fill="none" stroke="#E9FDFF" stroke-width="1.4" stroke-linejoin="round"></polyline>
<text transform="{{act.tx}}" class="lbl">COPILOT</text>
<circle cx="{{act.d1x}}" cy="{{act.d1y}}" r="1.4" fill="#E9FDFF"></circle>
</svg>

<svg class="layer" width="390" height="844" aria-hidden="true">
<path class="m1" d="{{motes1}}" fill="#BFEFFF"></path>
<path class="m2" d="{{motes2}}" fill="#BFEFFF"></path>
<path class="m3" d="{{motes3}}" fill="#BFEFFF"></path>
</svg>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(to bottom, rgba(2,6,15,0), rgba(2,6,15,.75) 55%, #02060F)"></div>

<div style="position: absolute; left: 22px; top: 26px; opacity: .85">
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3 L20 7.5 L11 12 L2 7.5 Z" fill="#5BE3FF"></path><path d="M2 11 L11 15.5 L20 11" stroke="#2E9BFF" stroke-width="1.6" fill="none" stroke-linejoin="round"></path><path d="M2 14.5 L11 19 L20 14.5" stroke="#1C5FB8" stroke-width="1.6" fill="none" stroke-linejoin="round"></path></svg>
</div>

<div style="position: absolute; right: 22px; top: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: .32em; color: #7F93B5">SCORE</span>
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 40px; font-weight: 600; font-stretch: 87.5%; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: #F4F8FF">3,300</span>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; align-items: center; justify-content: center; gap: 12px">
<div style="position: relative; width: 22px; height: 22px">
<div class="tap" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid #5BE3FF"></div>
<div style="position: absolute; left: 7px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: #5BE3FF"></div>
</div>
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: .28em; color: #A9BDDB">TAP ANYWHERE TO DROP</span>
</div>

<svg class="layer" width="390" height="844" aria-hidden="true" style="mix-blend-mode: overlay; opacity: .16">
<filter id="p-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="390" height="844" filter="url(#p-grain)"></rect>
</svg>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const k = 1, D = 110, H = 22;
    const C = 0.866 * k, S = 0.5 * k;
    const ox = 169, oy = 666;
    const f = (n) => n.toFixed(1);
    const P = (x, z, y) => [ox + (x - z) * C, oy + (x + z) * S - y * k];
    const pl = (a) => a.map((p) => f(p[0]) + ',' + f(p[1])).join(' ');
    const ln = (a, b) => 'M' + f(a[0]) + ',' + f(a[1]) + 'L' + f(b[0]) + ',' + f(b[1]);
    const box = (x0, w, y0, h) => {
      const x1 = x0 + w, yt = y0 + h;
      const la = P(x0 + 9, D, y0 + h / 2 - 3.2);
      const d1 = P(x1 - 11, D, y0 + h / 2);
      const d2 = P(x1 - 18, D, y0 + h / 2);
      return {
        top: pl([P(x0, 0, yt), P(x1, 0, yt), P(x1, D, yt), P(x0, D, yt)]),
        left: pl([P(x0, D, yt), P(x1, D, yt), P(x1, D, y0), P(x0, D, y0)]),
        right: pl([P(x1, 0, yt), P(x1, D, yt), P(x1, D, y0), P(x1, 0, y0)]),
        edge: pl([P(x0, D, yt), P(x1, D, yt), P(x1, 0, yt)]),
        tx: 'matrix(' + C + ' ' + S + ' 0 ' + k + ' ' + f(la[0]) + ' ' + f(la[1]) + ')',
        d1x: f(d1[0]), d1y: f(d1[1]), d2x: f(d2[0]), d2y: f(d2[1])
      };
    };
    const tint = (t) => {
      const h = Math.round(216 - t * 18);
      return {
        cTop: 'hsl(' + h + ',92%,' + Math.round(48 + t * 16) + '%)',
        cLeft: 'hsl(' + h + ',70%,' + Math.round(19 + t * 9) + '%)',
        cRight: 'hsl(' + h + ',72%,' + Math.round(11 + t * 6) + '%)',
        cEdge: 'hsl(' + (h - 10) + ',100%,' + Math.round(74 + t * 12) + '%)',
        op: (0.45 + t * 0.55).toFixed(2)
      };
    };
    const layers = [
      ['COMPUTE', 0, 170], ['STORAGE', 0, 170], ['ENTRA', 0, 166], ['DEFENDER', 4, 162],
      ['SHAREPOINT', 4, 162], ['COPILOT', 4, 156], ['INTUNE', 10, 150], ['FABRIC', 10, 150],
      ['TEAMS', 10, 144], ['AZURE SQL', 16, 138], ['SENTINEL', 16, 138], ['PURVIEW', 20, 134],
      ['COMPUTE', 20, 128]
    ];
    const n = layers.length;
    const blocks = layers.map((L, i) => Object.assign({ label: L[0] }, box(L[1], L[2], i * H, H), tint(i / (n - 1))));
    const topY = n * H, ay = topY + 34, ax = 58, aw = 128;
    const act = box(ax, aw, ay, H);
    const g1 = box(ax - 14, aw, ay, H), g2 = box(ax - 28, aw, ay, H);
    const shadow = pl([P(ax, 0, topY), P(148, 0, topY), P(148, D, topY), P(ax, D, topY)]);
    const rails = ln(P(ax, D, ay), P(ax, D, topY)) + ln(P(148, D, ay), P(148, D, topY));
    const dot = (x, y, r) => 'M' + (x - r) + ',' + y + 'a' + r + ',' + r + ' 0 1,0 ' + (2 * r) + ',0a' + r + ',' + r + ' 0 1,0 ' + (-2 * r) + ',0';
    const motes = [[46,470,1.1],[82,330,0.8],[300,420,1.2],[338,300,0.9],[120,250,0.7],[270,180,1],[60,160,0.8],[350,520,1],[230,120,0.7],[40,640,0.9],[330,660,0.8],[360,220,1]];
    const mp = ['', '', ''];
    motes.forEach((m, i) => { mp[i % 3] += dot(m[0], m[1], m[2]); });
    return { blocks, act, g1, g2, shadow, rails, motes1: mp[0], motes2: mp[1], motes3: mp[2] };
  }
}
</script>
</body>
</html>

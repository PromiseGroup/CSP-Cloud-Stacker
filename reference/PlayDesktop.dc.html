<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloud Stacker — Play (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&amp;family=Permanent+Marker&amp;family=Martian+Mono:wdth,wght@75..112.5,100..800&amp;display=swap">
<style>
body{margin:0}
.layer{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lbl{font-family:'Martian Mono',ui-monospace,monospace;font-size:8px;font-weight:500;letter-spacing:.14em;fill:rgba(240,248,255,.9)}
.neon{filter:drop-shadow(0 0 4px rgba(91,227,255,.9))}
.glowA{filter:drop-shadow(0 0 24px rgba(91,227,255,.55))}
.m1{animation:rise 10s linear infinite}
.m2{animation:rise 12s linear infinite -4s}
.m3{animation:rise 14s linear infinite -8s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-220px);opacity:0}}
.drift{animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.tap{animation:tap 1.6s ease-out infinite;transform-origin:center}
@keyframes tap{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.art{outline:1.5px dashed #FF3EA5;outline-offset:4px;border-radius:10px}
.art-tag{font-family:'Martian Mono',ui-monospace,monospace;font-size:8px;font-weight:600;letter-spacing:.16em;color:#FF3EA5;white-space:nowrap}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wall{font-family:'Permanent Marker','Mulish',sans-serif;text-transform:uppercase;white-space:nowrap;color:#F2EEE6}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #02060F; font-family: 'Mulish', ui-sans-serif, system-ui, sans-serif; color: #F4F8FF">

<div style="position: absolute; inset: 0; background: radial-gradient(70% 80% at 50% 38%, #0B3470 0%, #071D45 34%, #040C22 66%, #02060F 100%)"></div>
<div style="position: absolute; left: 320px; top: 80px; width: 800px; height: 560px; background: radial-gradient(closest-side, rgba(0,120,212,.55), rgba(0,120,212,0))"></div>

<svg class="layer" width="1440" height="900" aria-hidden="true">
<defs>
<pattern id="d-lat" width="57.15" height="33" patternUnits="userSpaceOnUse"><path d="M0,0 L57.15,33 M57.15,0 L0,33" stroke="#6AB4FF" stroke-width="0.6" fill="none"></path></pattern>
<radialGradient id="d-latFade" cx="50%" cy="40%" r="55%"><stop offset="0" stop-color="#fff" stop-opacity="1"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
<mask id="d-latMask"><rect width="1440" height="900" fill="url(#d-latFade)"></rect></mask>
<linearGradient id="d-sheen" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.32"></stop><stop offset="0.65" stop-color="#fff" stop-opacity="0"></stop></linearGradient>
<linearGradient id="d-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.10"></stop><stop offset="1" stop-color="#000" stop-opacity="0.32"></stop></linearGradient>
<linearGradient id="d-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2550" stop-opacity="1"></stop><stop offset="1" stop-color="#040C22" stop-opacity="0"></stop></linearGradient>
</defs>
<rect width="1440" height="900" fill="url(#d-lat)" mask="url(#d-latMask)" opacity="0.08"></rect>
</svg>

<sc-for list="{{far}}" as="t" hint-placeholder-count="4">
<svg class="layer" width="1440" height="900" aria-hidden="true" style="filter: blur(1.5px); opacity: .7">
<polygon points="{{t.left}}" fill="url(#d-far)"></polygon>
<polygon points="{{t.right}}" fill="url(#d-far)" opacity="0.6"></polygon>
<polygon points="{{t.top}}" fill="#123063"></polygon>
<polyline points="{{t.edge}}" fill="none" stroke="#3C7FD8" stroke-width="1" opacity="0.5"></polyline>
</svg>
</sc-for>

<div class="drift" style="position: absolute; left: -120px; top: 150px; width: 620px; height: 160px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,195,255,.16), rgba(150,195,255,0)); filter: blur(12px)"></div>
<div class="drift" style="position: absolute; right: -140px; top: 300px; width: 660px; height: 170px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,195,255,.13), rgba(150,195,255,0)); filter: blur(14px)"></div>
<div class="drift" style="position: absolute; left: 420px; top: 40px; width: 560px; height: 120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,195,255,.10), rgba(150,195,255,0)); filter: blur(12px)"></div>
<div style="position: absolute; left: 560px; top: -40px; width: 320px; height: 440px; background: linear-gradient(to top, rgba(91,227,255,.18), rgba(91,227,255,0)); filter: blur(30px)"></div>

<sc-for list="{{blocks}}" as="b" hint-placeholder-count="13">
<svg class="layer" width="1440" height="900" aria-hidden="true">
<polygon points="{{b.left}}" fill="{{b.cLeft}}"></polygon>
<polygon points="{{b.left}}" fill="url(#d-side)"></polygon>
<polygon points="{{b.right}}" fill="{{b.cRight}}"></polygon>
<polygon points="{{b.top}}" fill="{{b.cTop}}"></polygon>
<polygon points="{{b.top}}" fill="url(#d-sheen)"></polygon>
<polyline class="neon" points="{{b.edge}}" fill="none" stroke="{{b.cEdge}}" stroke-width="1.6" stroke-linejoin="round" opacity="{{b.op}}"></polyline>
<text transform="{{b.tx}}" class="lbl">{{b.label}}</text>
<circle cx="{{b.d1x}}" cy="{{b.d1y}}" r="2" fill="#7CF5FF"></circle>
<circle cx="{{b.d2x}}" cy="{{b.d2y}}" r="2" fill="#7CF5FF" opacity="0.4"></circle>
</svg>
</sc-for>

<svg class="layer" width="1440" height="900" aria-hidden="true">
<polygon points="{{shadow}}" fill="#00081C" opacity="0.42"></polygon>
<path d="{{rails}}" stroke="#5BE3FF" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6"></path>
<polygon points="{{g2.top}}" fill="#8FE6FF" opacity="0.05"></polygon>
<polygon points="{{g2.left}}" fill="#8FE6FF" opacity="0.04"></polygon>
<polygon points="{{g1.top}}" fill="#8FE6FF" opacity="0.10"></polygon>
<polygon points="{{g1.left}}" fill="#8FE6FF" opacity="0.08"></polygon>
</svg>

<svg class="layer glowA" width="1440" height="900" aria-hidden="true">
<polygon points="{{act.left}}" fill="hsl(204,78%,34%)"></polygon>
<polygon points="{{act.left}}" fill="url(#d-side)"></polygon>
<polygon points="{{act.right}}" fill="hsl(206,80%,22%)"></polygon>
<polygon points="{{act.top}}" fill="hsl(194,100%,74%)"></polygon>
<polygon points="{{act.top}}" fill="url(#d-sheen)"></polygon>
<polyline class="neon" points="{{act.edge}}" fill="none" stroke="#E9FDFF" stroke-width="1.8" stroke-linejoin="round"></polyline>
<text transform="{{act.tx}}" class="lbl">SALES</text>
<circle cx="{{act.d1x}}" cy="{{act.d1y}}" r="2" fill="#E9FDFF"></circle>
</svg>

<svg class="layer" width="1440" height="900" aria-hidden="true">
<path class="m1" d="{{motes1}}" fill="#BFEFFF"></path>
<path class="m2" d="{{motes2}}" fill="#BFEFFF"></path>
<path class="m3" d="{{motes3}}" fill="#BFEFFF"></path>
</svg>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 280px; background: linear-gradient(to bottom, rgba(2,6,15,0), rgba(2,6,15,.75) 55%, #02060F)"></div>
<div style="position: absolute; inset: 0; background: radial-gradient(90% 90% at 50% 45%, rgba(2,6,15,0) 55%, rgba(2,6,15,.7) 100%)"></div>

<div style="position: absolute; left: 44px; bottom: 84px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<span class="art-tag">× YOUR ART · MASCOT · IDLE</span>
<div class="art bob" style="width: 84px; height: 101px">
<svg width="84" height="101" viewBox="0 0 80 96" role="img" aria-label="Mascot placeholder (on-prem server), idle pose"><path d="M57 16 C60 6 71 5 72 13" stroke="#F2EEE6" stroke-width="2" fill="none" stroke-linecap="round"></path><rect x="69" y="12" width="6" height="5" rx="1" fill="#F2EEE6"></rect><path d="M27 80 V89 M53 80 V89" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"></path><path d="M22 90 H31 M49 90 H58" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"></path><rect x="12" y="16" width="56" height="65" rx="8" fill="#0A0D14" stroke="#F2EEE6" stroke-width="2"></rect><rect x="19" y="23" width="42" height="25" rx="4" fill="#F2EEE6"></rect><path d="M20 57 H50 M20 65 H50 M20 73 H50" stroke="#F2EEE6" stroke-width="1.6" stroke-linecap="round" opacity="0.7"></path><circle cx="57" cy="57" r="2" fill="#7CF5FF"></circle><circle cx="57" cy="65" r="2" fill="#FFB23F"></circle><path d="M26 33 H35 M44 33 H53" stroke="#0A0D14" stroke-width="2.6" stroke-linecap="round"></path><circle cx="33" cy="36.5" r="2" fill="#0A0D14"></circle><circle cx="51" cy="36.5" r="2" fill="#0A0D14"></circle><path d="M37 43 H44" stroke="#0A0D14" stroke-width="2" stroke-linecap="round"></path></svg>
</div>
</div>

<div style="position: absolute; left: 40px; top: 36px; display: flex; align-items: center; gap: 12px">
<svg width="26" height="26" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3 L20 7.5 L11 12 L2 7.5 Z" fill="#5BE3FF"></path><path d="M2 11 L11 15.5 L20 11" stroke="#2E9BFF" stroke-width="1.6" fill="none" stroke-linejoin="round"></path><path d="M2 14.5 L11 19 L20 14.5" stroke="#1C5FB8" stroke-width="1.6" fill="none" stroke-linejoin="round"></path></svg>
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600; letter-spacing: .26em; color: #DCE8FA">× COMPANY LOGO SLOT</span>
</div>

<div style="position: absolute; right: 40px; top: 30px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .34em; color: #7F93B5">SCORE</span>
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 64px; font-weight: 600; font-stretch: 87.5%; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: #F4F8FF">3,300</span>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 40px; display: flex; align-items: center; justify-content: center; gap: 14px">
<div style="position: relative; width: 24px; height: 24px">
<div class="tap" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid #5BE3FF"></div>
<div style="position: absolute; left: 8px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: #5BE3FF"></div>
</div>
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .3em; color: #A9BDDB">CLICK ANYWHERE TO DROP</span>
</div>

<svg class="layer" width="1440" height="900" aria-hidden="true" style="mix-blend-mode: overlay; opacity: .14">
<filter id="d-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="1440" height="900" filter="url(#d-grain)"></rect>
</svg>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const f = (n) => n.toFixed(1);
    const pl = (a) => a.map((p) => f(p[0]) + ',' + f(p[1])).join(' ');
    const make = (ox, oy, k, D) => {
      const C = 0.866 * k, S = 0.5 * k;
      const P = (x, z, y) => [ox + (x - z) * C, oy + (x + z) * S - y * k];
      const box = (x0, w, y0, h) => {
        const x1 = x0 + w, yt = y0 + h;
        const la = P(x0 + 9, D, y0 + h / 2 - 3.2);
        const d1 = P(x1 - 11, D, y0 + h / 2);
        const d2 = P(x1 - 18, D, y0 + h / 2);
        return {
          top: pl([P(x0, 0, yt), P(x1, 0, yt), P(x1, D, yt), P(x0, D, yt)]),
          left: pl([P(x0, D, yt), P(x1, D, yt), P(x1, D, y0), P(x0, D, y0)]),
          right: pl([P(x1, 0, yt), P(x1, D, yt), P(x1, D, y0), P(x1, 0, y0)]),
          edge: pl([P(x0, D, yt), P(x1, D, yt), P(x1, 0, yt)]),
          tx: 'matrix(' + C.toFixed(3) + ' ' + S.toFixed(3) + ' 0 ' + k + ' ' + f(la[0]) + ' ' + f(la[1]) + ')',
          d1x: f(d1[0]), d1y: f(d1[1]), d2x: f(d2[0]), d2y: f(d2[1])
        };
      };
      return { P, box };
    };
    const D = 110, H = 22;
    const main = make(681, 774, 1.5, D);
    const P = main.P, box = main.box;
    const ln = (a, b) => 'M' + f(a[0]) + ',' + f(a[1]) + 'L' + f(b[0]) + ',' + f(b[1]);
    const tint = (t) => {
      const h = Math.round(216 - t * 18);
      return {
        cTop: 'hsl(' + h + ',92%,' + Math.round(48 + t * 16) + '%)',
        cLeft: 'hsl(' + h + ',70%,' + Math.round(19 + t * 9) + '%)',
        cRight: 'hsl(' + h + ',72%,' + Math.round(11 + t * 6) + '%)',
        cEdge: 'hsl(' + (h - 10) + ',100%,' + Math.round(74 + t * 12) + '%)',
        op: (0.45 + t * 0.55).toFixed(2)
      };
    };
    const layers = [
      ['FINANCE', 0, 170], ['SALES', 0, 170], ['PURCHASING', 0, 166], ['INVENTORY', 4, 162],
      ['WAREHOUSE', 4, 162], ['PROJECTS', 4, 156], ['SERVICE', 10, 150], ['E-DOCUMENTS', 10, 150],
      ['APPSOURCE', 10, 144], ['POWER BI', 16, 138], ['COPILOT', 16, 138], ['AI AGENTS', 20, 134],
      ['AGENTIC ERP', 20, 128]
    ];
    const n = layers.length;
    const blocks = layers.map((L, i) => Object.assign({ label: L[0] }, box(L[1], L[2], i * H, H), tint(i / (n - 1))));
    const topY = n * H, ay = topY + 34, ax = 58, aw = 128;
    const act = box(ax, aw, ay, H);
    const g1 = box(ax - 14, aw, ay, H), g2 = box(ax - 28, aw, ay, H);
    const shadow = pl([P(ax, 0, topY), P(148, 0, topY), P(148, D, topY), P(ax, D, topY)]);
    const rails = ln(P(ax, D, ay), P(ax, D, topY)) + ln(P(148, D, ay), P(148, D, topY));
    const far = [
      make(170, 760, 0.9, 90).box(0, 120, 0, 360),
      make(380, 860, 0.7, 80).box(0, 100, 0, 300),
      make(1060, 820, 0.8, 90).box(0, 130, 0, 400),
      make(1270, 760, 0.9, 80).box(0, 110, 0, 330)
    ];
    const dot = (x, y, r) => 'M' + (x - r) + ',' + y + 'a' + r + ',' + r + ' 0 1,0 ' + (2 * r) + ',0a' + r + ',' + r + ' 0 1,0 ' + (-2 * r) + ',0';
    const motes = [[180,520,1.4],[300,360,1],[420,600,1.2],[520,240,0.9],[560,700,1.1],[880,640,1.2],[940,280,0.9],[1040,520,1.3],[1150,380,1],[1260,600,1.2],[1340,260,0.9],[640,160,1],[820,180,0.8],[240,720,1.1],[1200,720,1]];
    const mp = ['', '', ''];
    motes.forEach((m, i) => { mp[i % 3] += dot(m[0], m[1], m[2]); });
    return { blocks, act, g1, g2, shadow, rails, far, motes1: mp[0], motes2: mp[1], motes3: mp[2] };
  }
}
</script>
</body>
</html>

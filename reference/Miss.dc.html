<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloud Stacker — Missed drop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&amp;family=Permanent+Marker&amp;family=Martian+Mono:wdth,wght@75..112.5,100..800&amp;display=swap">
<style>
body{margin:0}
.layer{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.lbl{font-family:'Martian Mono',ui-monospace,monospace;font-size:8px;font-weight:500;letter-spacing:.14em;fill:rgba(240,248,255,.9)}
.neon{filter:drop-shadow(0 0 3px rgba(91,227,255,.9))}
.hot{filter:drop-shadow(0 0 6px rgba(255,178,63,.95)) drop-shadow(0 0 2px rgba(255,220,160,1))}
.glowA{filter:drop-shadow(0 0 12px rgba(91,227,255,.4))}
.fall{animation:fall 1.8s cubic-bezier(.5,0,.9,.6) infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0deg);opacity:1}100%{transform:translate(40px,260px) rotate(40deg);opacity:0}}
.pop{animation:pop 1.6s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes pop{0%{transform:translateY(12px);opacity:0}18%{transform:translateY(0);opacity:1}70%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.art{outline:1.5px dashed #FF3EA5;outline-offset:4px;border-radius:10px}
.art-tag{font-family:'Martian Mono',ui-monospace,monospace;font-size:8px;font-weight:600;letter-spacing:.16em;color:#FF3EA5;white-space:nowrap}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wall{font-family:'Permanent Marker','Mulish',sans-serif;text-transform:uppercase;white-space:nowrap;color:#F2EEE6}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #02060F; font-family: 'Mulish', ui-sans-serif, system-ui, sans-serif; color: #F4F8FF">

<div style="position: absolute; inset: 0; background: radial-gradient(130% 75% at 50% 40%, #0B3470 0%, #071D45 36%, #040C22 68%, #02060F 100%)"></div>
<div style="position: absolute; left: -70px; top: 170px; width: 530px; height: 400px; background: radial-gradient(closest-side, rgba(0,120,212,.55), rgba(0,120,212,0))"></div>

<svg class="layer" width="390" height="844" aria-hidden="true">
<defs>
<pattern id="s-lat" width="38.1" height="22" patternUnits="userSpaceOnUse"><path d="M0,0 L38.1,22 M38.1,0 L0,22" stroke="#6AB4FF" stroke-width="0.5" fill="none"></path></pattern>
<radialGradient id="s-latFade" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff" stop-opacity="1"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
<mask id="s-latMask"><rect width="390" height="844" fill="url(#s-latFade)"></rect></mask>
<linearGradient id="s-sheen" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.32"></stop><stop offset="0.65" stop-color="#fff" stop-opacity="0"></stop></linearGradient>
<linearGradient id="s-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.10"></stop><stop offset="1" stop-color="#000" stop-opacity="0.32"></stop></linearGradient>
<linearGradient id="s-cut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD58A"></stop><stop offset="1" stop-color="#E07A12"></stop></linearGradient>
</defs>
<rect width="390" height="844" fill="url(#s-lat)" mask="url(#s-latMask)" opacity="0.09"></rect>
</svg>

<div class="drift" style="position: absolute; left: -90px; top: 120px; width: 300px; height: 90px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,195,255,.18), rgba(150,195,255,0)); filter: blur(8px)"></div>
<div class="drift" style="position: absolute; right: -110px; top: 250px; width: 330px; height: 100px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,195,255,.14), rgba(150,195,255,0)); filter: blur(10px)"></div>
<div style="position: absolute; left: 70px; top: 60px; width: 250px; height: 320px; background: linear-gradient(to top, rgba(91,227,255,.18), rgba(91,227,255,0)); filter: blur(22px)"></div>

<sc-for list="{{blocks}}" as="b" hint-placeholder-count="13">
<svg class="layer" width="390" height="844" aria-hidden="true">
<polygon points="{{b.left}}" fill="{{b.cLeft}}"></polygon>
<polygon points="{{b.left}}" fill="url(#s-side)"></polygon>
<polygon points="{{b.right}}" fill="{{b.cRight}}"></polygon>
<polygon points="{{b.top}}" fill="{{b.cTop}}"></polygon>
<polygon points="{{b.top}}" fill="url(#s-sheen)"></polygon>
<polyline class="neon" points="{{b.edge}}" fill="none" stroke="{{b.cEdge}}" stroke-width="1.2" stroke-linejoin="round" opacity="{{b.op}}"></polyline>
<text transform="{{b.tx}}" class="lbl">{{b.label}}</text>
<circle cx="{{b.d1x}}" cy="{{b.d1y}}" r="1.4" fill="#7CF5FF"></circle>
<circle cx="{{b.d2x}}" cy="{{b.d2y}}" r="1.4" fill="#7CF5FF" opacity="0.4"></circle>
</svg>
</sc-for>

<svg class="layer" width="390" height="844" aria-hidden="true">
<g transform="{{shardT}}">
<g class="fall" style="transform-box: fill-box; transform-origin: center">
<polygon points="{{shard.left}}" fill="hsl(200,70%,27%)"></polygon>
<polygon points="{{shard.left}}" fill="url(#s-side)"></polygon>
<polygon points="{{shard.right}}" fill="hsl(200,72%,17%)"></polygon>
<polygon points="{{shard.top}}" fill="hsl(198,92%,62%)"></polygon>
<polyline class="neon" points="{{shard.edge}}" fill="none" stroke="#7CF5FF" stroke-width="1.2" stroke-linejoin="round"></polyline>
</g>
</g>
<path d="{{streaks}}" stroke="#5BE3FF" stroke-width="1" stroke-linecap="round" opacity="0.4"></path>
</svg>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(to bottom, rgba(2,6,15,0), rgba(2,6,15,.75) 55%, #02060F)"></div>

<div style="position: absolute; left: 18px; bottom: 66px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<span class="art-tag">× YOUR ART · MASCOT · MISS</span>
<div class="art bob" style="width: 60px; height: 72px">
<svg width="60" height="72" viewBox="0 0 80 96" role="img" aria-label="Mascot placeholder (on-prem server), miss pose"><path d="M57 16 C60 6 71 5 72 13" stroke="#F2EEE6" stroke-width="2" fill="none" stroke-linecap="round"></path><rect x="69" y="12" width="6" height="5" rx="1" fill="#F2EEE6"></rect><path d="M27 80 V89 M53 80 V89" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"></path><path d="M22 90 H31 M49 90 H58" stroke="#F2EEE6" stroke-width="3.2" stroke-linecap="round"></path><rect x="12" y="16" width="56" height="65" rx="8" fill="#0A0D14" stroke="#F2EEE6" stroke-width="2"></rect><rect x="19" y="23" width="42" height="25" rx="4" fill="#F2EEE6"></rect><path d="M20 57 H50 M20 65 H50 M20 73 H50" stroke="#F2EEE6" stroke-width="1.6" stroke-linecap="round" opacity="0.7"></path><circle cx="57" cy="57" r="2" fill="#7CF5FF"></circle><circle cx="57" cy="65" r="2" fill="#FFB23F"></circle><circle cx="31" cy="33" r="5.4" fill="none" stroke="#0A0D14" stroke-width="2"></circle><circle cx="49" cy="33" r="5.4" fill="none" stroke="#0A0D14" stroke-width="2"></circle><circle cx="31" cy="35.6" r="1.7" fill="#0A0D14"></circle><circle cx="49" cy="35.6" r="1.7" fill="#0A0D14"></circle><ellipse cx="40" cy="44" rx="3.6" ry="3" fill="#0A0D14"></ellipse><path d="M5 8 V19 M5 23 V24 M12 8 V19 M12 23 V24" stroke="#FF3EA5" stroke-width="2.6" stroke-linecap="round"></path></svg>
</div>
</div>

<div style="position: absolute; left: 22px; top: 26px; opacity: .85">
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3 L20 7.5 L11 12 L2 7.5 Z" fill="#5BE3FF"></path><path d="M2 11 L11 15.5 L20 11" stroke="#2E9BFF" stroke-width="1.6" fill="none" stroke-linejoin="round"></path><path d="M2 14.5 L11 19 L20 14.5" stroke="#1C5FB8" stroke-width="1.6" fill="none" stroke-linejoin="round"></path></svg>
</div>

<div style="position: absolute; right: 22px; top: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: .32em; color: #7F93B5">SCORE</span>
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 40px; font-weight: 600; font-stretch: 87.5%; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: #F4F8FF">3,400</span>
</div>

<svg class="layer" width="390" height="844" aria-hidden="true" style="mix-blend-mode: overlay; opacity: .16">
<filter id="s-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="390" height="844" filter="url(#s-grain)"></rect>
</svg>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const k = 1, D = 110, H = 22;
    const C = 0.866 * k, S = 0.5 * k;
    const ox = 169, oy = 666;
    const f = (n) => n.toFixed(1);
    const P = (x, z, y) => [ox + (x - z) * C, oy + (x + z) * S - y * k];
    const pl = (a) => a.map((p) => f(p[0]) + ',' + f(p[1])).join(' ');
    const ln = (a, b) => 'M' + f(a[0]) + ',' + f(a[1]) + 'L' + f(b[0]) + ',' + f(b[1]);
    const box = (x0, w, y0, h) => {
      const x1 = x0 + w, yt = y0 + h;
      const la = P(x0 + 9, D, y0 + h / 2 - 3.2);
      const d1 = P(x1 - 11, D, y0 + h / 2);
      const d2 = P(x1 - 18, D, y0 + h / 2);
      return {
        top: pl([P(x0, 0, yt), P(x1, 0, yt), P(x1, D, yt), P(x0, D, yt)]),
        left: pl([P(x0, D, yt), P(x1, D, yt), P(x1, D, y0), P(x0, D, y0)]),
        right: pl([P(x1, 0, yt), P(x1, D, yt), P(x1, D, y0), P(x1, 0, y0)]),
        edge: pl([P(x0, D, yt), P(x1, D, yt), P(x1, 0, yt)]),
        edgeL: pl([P(x0, D, yt), P(x1, D, yt)]),
        cutEdge: pl([P(x0, 0, yt), P(x0, D, yt), P(x0, D, y0)]),
        tx: 'matrix(' + C + ' ' + S + ' 0 ' + k + ' ' + f(la[0]) + ' ' + f(la[1]) + ')',
        d1x: f(d1[0]), d1y: f(d1[1]), d2x: f(d2[0]), d2y: f(d2[1])
      };
    };
    const tint = (t) => {
      const h = Math.round(216 - t * 18);
      return {
        cTop: 'hsl(' + h + ',92%,' + Math.round(48 + t * 16) + '%)',
        cLeft: 'hsl(' + h + ',70%,' + Math.round(19 + t * 9) + '%)',
        cRight: 'hsl(' + h + ',72%,' + Math.round(11 + t * 6) + '%)',
        cEdge: 'hsl(' + (h - 10) + ',100%,' + Math.round(74 + t * 12) + '%)',
        op: (0.45 + t * 0.55).toFixed(2)
      };
    };
    const layers = [
      ['FINANCE', 0, 170], ['SALES', 0, 170], ['PURCHASING', 0, 166], ['INVENTORY', 4, 162],
      ['WAREHOUSE', 4, 162], ['PROJECTS', 4, 156], ['SERVICE', 10, 150], ['E-DOCUMENTS', 10, 150],
      ['APPSOURCE', 10, 144], ['POWER BI', 16, 138], ['COPILOT', 16, 138], ['AI AGENTS', 20, 134],
      ['AGENTIC ERP', 20, 128]
    ];
    const n = layers.length;
    const blocks = layers.map((L, i) => Object.assign({ label: L[0] }, box(L[1], L[2], i * H, H), tint(i / (n - 1))));
    const ly = n * H, yt = ly + H;
    const shard = box(196, 120, ly + 20, H);
    const sc = P(256, D / 2, ly + 20 + H / 2);
    const tx = 52, ty = 120;
    const shardT = 'translate(' + tx + ' ' + ty + ') rotate(14 ' + f(sc[0]) + ' ' + f(sc[1]) + ')';
    const bx = sc[0] + tx, by = sc[1] + ty;
    const streaks = 'M' + f(bx - 40) + ',' + f(by - 120) + 'L' + f(bx - 40) + ',' + f(by - 70) +
      'M' + f(bx) + ',' + f(by - 150) + 'L' + f(bx) + ',' + f(by - 80) +
      'M' + f(bx + 40) + ',' + f(by - 110) + 'L' + f(bx + 40) + ',' + f(by - 66);
    return { blocks, shard, shardT, streaks };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloud Stacker — Prize raffle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&amp;family=Permanent+Marker&amp;family=Martian+Mono:wdth,wght@75..112.5,100..800&amp;display=swap">
<style>
body{margin:0}
.layer{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.fld::placeholder{color:#5F7598}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) .1s both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.go:hover{background:#0A7BDA}
.art{outline:1.5px dashed #FF3EA5;outline-offset:4px;border-radius:10px}
.art-tag{font-family:'Martian Mono',ui-monospace,monospace;font-size:8px;font-weight:600;letter-spacing:.16em;color:#FF3EA5;white-space:nowrap}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wall{font-family:'Permanent Marker','Mulish',sans-serif;text-transform:uppercase;white-space:nowrap;color:#F2EEE6}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #02060F; font-family: 'Mulish', ui-sans-serif, system-ui, sans-serif; color: #F4F8FF">

<div style="position: absolute; inset: 0; background: radial-gradient(120% 60% at 50% 0%, #0B3470 0%, #071D45 34%, #040C22 66%, #02060F 100%)"></div>
<div style="position: absolute; left: -80px; top: -120px; width: 550px; height: 340px; background: radial-gradient(closest-side, rgba(0,120,212,.5), rgba(0,120,212,0))"></div>
<svg class="layer" width="390" height="844" aria-hidden="true">
<defs>
<pattern id="r-lat" width="38.1" height="22" patternUnits="userSpaceOnUse"><path d="M0,0 L38.1,22 M38.1,0 L0,22" stroke="#6AB4FF" stroke-width="0.5" fill="none"></path></pattern>
<radialGradient id="r-latFade" cx="50%" cy="10%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity="1"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
<mask id="r-latMask"><rect width="390" height="844" fill="url(#r-latFade)"></rect></mask>
</defs>
<rect width="390" height="844" fill="url(#r-lat)" mask="url(#r-latMask)" opacity="0.10"></rect>
</svg>

<div aria-hidden="true" style="position: absolute; inset: -10px -40px; overflow: hidden; opacity: 0.06; display: flex; flex-direction: column; gap: 2px; transform: rotate(-4deg)">
<sc-for list="{{wall}}" as="ln" hint-placeholder-count="20"><div class="wall" style="font-size: 30px; line-height: 1.12">{{ln}}</div></sc-for>
</div>
<span class="art-tag" style="position: absolute; right: 20px; bottom: 10px; z-index: 2">× YOUR ART · TEXT WALL (STAND-IN LETTERING)</span>

<div class="rise" style="position: absolute; left: 20px; right: 20px; top: 26px; bottom: 24px; display: flex; flex-direction: column; gap: 22px">

<div style="align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border-radius: 999px; background: #0A1D42; border: 1px solid rgba(91,227,255,.25)">
<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="#5BE3FF" opacity=".16"></circle><path d="M5.2 9.3l2.4 2.3 5.2-5.2" stroke="#5BE3FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; letter-spacing: .12em; color: #F4F8FF">KRZ</span>
<span style="width: 1px; height: 14px; background: #2A4676"></span>
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: #F4F8FF">3,400</span>
<span style="font-size: 12px; color: #A9BDDB">saved</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div class="art" style="align-self: flex-start; padding: 3px 8px; font-family: 'Martian Mono', ui-monospace, monospace; font-size: 10px; font-weight: 600; letter-spacing: .2em; color: #5BE3FF">× EVENT LOGO SLOT · DIRECTIONS EMEA 2026</div>
<h1 style="margin: 0; font-size: 36px; line-height: .98; font-weight: 900; letter-spacing: -0.035em; color: #F4F8FF">Enter the prize raffle!</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #A9BDDB">Leave your details for a chance to win <span style="color: #F4F8FF; font-weight: 600">[PRIZE]</span>.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 18px; border: 1px dashed rgba(120,170,255,.38); background: rgba(6,20,48,.55)">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#6F86AD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4L2 8l3.5 4"></path><path d="M10.5 4L14 8l-3.5 4"></path></svg>
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 9px; font-weight: 500; letter-spacing: .24em; color: #7F93B5">D365 FORM EMBED · STYLED PREVIEW</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fn" style="font-size: 12px; font-weight: 600; color: #C9D7EC">First name</label>
<input id="fn" class="fld" type="text" placeholder="First name" style="height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #22406E; background: #081733; color: #F4F8FF; font-family: inherit; font-size: 15px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ln" style="font-size: 12px; font-weight: 600; color: #C9D7EC">Last name</label>
<input id="ln" class="fld" type="text" placeholder="Last name" style="height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #22406E; background: #081733; color: #F4F8FF; font-family: inherit; font-size: 15px">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="em" style="font-size: 12px; font-weight: 600; color: #C9D7EC">Work email</label>
<input id="em" class="fld" type="email" placeholder="name@company.com" style="height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1.5px solid #3AA0FF; box-shadow: 0 0 0 4px rgba(0,120,212,.25); background: #0A1D42; color: #F4F8FF; font-family: inherit; font-size: 15px">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="co" style="font-size: 12px; font-weight: 600; color: #C9D7EC">Company</label>
<input id="co" class="fld" type="text" placeholder="Company name" style="height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #22406E; background: #081733; color: #F4F8FF; font-family: inherit; font-size: 15px">
</div>

<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 12px; line-height: 1.45; color: #A9BDDB">
<input type="checkbox" style="margin: 1px 0 0; width: 18px; height: 18px; accent-color: #0070C9; flex: none">
<span>[CONSENT TEXT FROM YOUR D365 FORM]</span>
</label>

<button type="button" class="go" style="height: 54px; border: 0; border-radius: 12px; background: #0070C9; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; box-shadow: 0 12px 30px rgba(0,112,201,.35)">Enter the raffle</button>
</div>

<p style="margin: 0; text-align: center; font-size: 12px; color: #7F93B5">After you submit, the game resets for the next player.</p>
</div>

<svg class="layer" width="390" height="844" aria-hidden="true" style="mix-blend-mode: overlay; opacity: .14">
<filter id="r-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="390" height="844" filter="url(#r-grain)"></rect>
</svg>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const phrase = 'STILL ON NAV \u00d7 UPGRADE IT \u00d7 ';
    const long = phrase.repeat(8);
    const wall = Array.from({ length: 26 }, (_, i) => long.slice((i * 7) % phrase.length));
    return { wall };
  }
}
</script>
</body>
</html>
